<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPower - Contacto</title>
    <link rel="icon" type="image/x-icon" href="../assets/logos/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/style.css"> <!-- css comun -->
    <link rel="stylesheet" href="../css/contacto.css"> <!-- css contacto -->
    <link rel="stylesheet" href="../css/mobile.css"> <!-- css mobile -->
</head>
<body>

<header class="w-100 py-3 bg-black">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-uppercase fs-3" href="../../index.html">
                FIT<span class="text-primary">POWER</span>
            </a>

            <!-- menu hamburguesa -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>   
            </button>

            <!-- links header -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-lg-3 text-center my-3 my-lg-0">
                    <li class="nav-item"><a class="nav-link" href="../../index.html">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link" href="entrenadores.html">ENTRENADORES</a></li>
                    <li class="nav-item"><a class="nav-link" href="planes.html">PLANES</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">CONTACTO</a></li>
                </ul>
                <div class="text-center">
                    <a href="login.html" class="btn btn-primary px-4 py-2 rounded-1 fw-semibold text-uppercase">Conectar</a>
                </div>
            </div>
        </div>
    </nav>
</header>

<main>
    <section class="contact-section bg-black text-white py-5">
        <div class="container py-4">

            <!-- boton volver -->
            <a href="../../index.html" class="back-link d-inline-flex align-items-center gap-2 text-decoration-none mb-5">
                <span class="back-arrow">←</span>
                <span class="text-uppercase small fw-semibold">Volver</span>
            </a>

            <div class="text-center mb-5">
                <h1 class="display-4 fw-black text-uppercase lh-1 mb-3">Contacta<span class="text-primary">nos</span></h1>
                <p class="text-secondary mb-0">¿Tenés dudas? Escribinos y te respondemos a la brevedad.</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <form class="d-flex flex-column gap-3">
                        <input type="text" class="form-control contact-input" placeholder="Nombre">
                        <input type="email" class="form-control contact-input" placeholder="Email">
                        <textarea class="form-control contact-input" rows="5" placeholder="Mensaje"></textarea>
                        <button type="submit" class="btn btn-primary py-3 fw-bold text-uppercase rounded-1">Enviar</button>
                    </form>

                    <div class="text-center mt-5 text-secondary small">
                        <p class="mb-1">Av. Principal 1111</p>
                        <p class="mb-1">contacto@fitpower.com</p>
                        <p class="mb-0">+598 099 123 123</p>
                    </div>
                </div>
            </div>

        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="../js/script.js"></script> <!-- javascript nuestro -->
