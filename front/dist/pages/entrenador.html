<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenador - FitPower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--fondo:#0a0a0a;--caja:#141414;--caja2:#1a1a1a;--borde:#242424;--txt:#fff;--gris:#8a8a8a;--azul:#2f6bff;--azul-s:rgba(47,107,255,.14);--verde:#22c55e;--amarillo:#facc15;--rojo:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--txt);font-family:"Inter","Segoe UI",sans-serif;font-size:14px;min-height:100vh}
button,input,select{font-family:inherit}
header{display:flex;align-items:center;gap:28px;padding:14px 32px;border-bottom:1px solid var(--borde);position:sticky;top:0;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);z-index:20}
.logo{font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:3px}.logo b{color:var(--azul);font-weight:400}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{background:none;border:0;color:var(--gris);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
nav button:hover{color:#fff}nav button.on{background:var(--azul-s);color:var(--azul)}
.vivo{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--gris);letter-spacing:.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulso 1.8s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.perfil{position:relative}
.avatar{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,#bfeaff 0%,#5ec8f2 55%,#2aa3e0 100%);color:#002a5c;font-weight:800;font-size:15px;letter-spacing:.5px;text-shadow:0 1px 0 rgba(255,255,255,.55);box-shadow:0 0 0 2px var(--fondo),0 0 0 4px rgba(94,200,242,.55)}
.menu{display:none;position:absolute;right:0;top:54px;width:210px;background:var(--caja);border:1px solid var(--borde);border-radius:14px;padding:8px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.menu.abierto{display:block}
.menu p{margin:0;padding:10px 12px 12px;border-bottom:1px solid var(--borde);font-size:12px;color:var(--gris)}.menu p b{display:block;color:#fff;font-size:14px}
.menu button{width:100%;margin-top:6px;background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.menu button:hover{background:rgba(239,68,68,.12);color:var(--rojo)}
main{max-width:1200px;margin:0 auto;padding:32px}
h2{margin:0 0 4px;font-size:22px;font-weight:800}.sub{color:var(--gris);margin:0 0 24px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--caja);border:1px solid var(--borde);border-radius:16px;padding:20px}
.kpi small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gris);font-weight:600}
.kpi strong{display:block;font-size:34px;font-weight:800;margin-top:8px}.kpi span{font-size:12px;color:var(--gris)}
.kpi.az{background:linear-gradient(135deg,#0b2a7a,var(--azul));border:0}.kpi.az small,.kpi.az span{color:rgba(255,255,255,.75)}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.btn{background:var(--azul);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.5px}
.btn:hover{filter:brightness(1.12)}.btn.sec{background:var(--caja2);border:1px solid var(--borde);color:#ddd}
.btn.x{background:none;border:1px solid var(--borde);color:var(--gris);padding:6px 10px}.btn.x:hover{border-color:var(--rojo);color:var(--rojo)}
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gris);text-align:left;padding:10px 14px;font-weight:600}
td{padding:12px 14px;border-top:1px solid var(--borde)}
tr.baja td{opacity:.45}
.tabla{overflow-x:auto;padding:6px}
.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700}
.tag i{width:8px;height:8px;border-radius:50%;background:currentColor}
.t-paga{color:var(--verde);background:rgba(34,197,94,.12)}.t-retrasada{color:var(--amarillo);background:rgba(250,204,21,.12)}
.t-nopaga{color:var(--rojo);background:rgba(239,68,68,.12)}.t-baja{color:var(--gris);background:#222}
.dias{width:64px;background:var(--caja2);border:1px solid var(--borde);color:#fff;border-radius:8px;padding:7px;text-align:center;font-weight:700}
.dias:focus,.campo input:focus,.campo select:focus{outline:0;border-color:var(--azul)}
.on-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#444;margin-right:8px}.on-dot.si{background:var(--verde)}
.dosc{display:grid;grid-template-columns:260px 1fr;gap:14px}
.lista button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:#ccc;padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:600;margin-bottom:4px}
.lista button.on{background:var(--azul-s);border-color:rgba(47,107,255,.35);color:var(--azul)}
.ej{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--borde)}.ej:first-of-type{border-top:0}
.ej .n{width:28px;height:28px;border-radius:8px;background:var(--azul-s);color:var(--azul);display:grid;place-items:center;font-weight:800;font-size:12px}.ej div{flex:1}.ej small{color:var(--gris)}
.barras{display:flex;align-items:flex-end;gap:14px;height:170px;margin-top:16px}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--gris)}
.barras i{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--azul),#0b2a7a);min-height:4px}.barras div:last-child i{background:linear-gradient(180deg,#7fb0ff,var(--azul))}
.sem{display:flex;gap:10px;flex-wrap:wrap}.sem .tag{font-size:12px;padding:8px 14px}
.fondo-m{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:50}.fondo-m.abierto{display:grid}
.modal{width:min(400px,92vw);background:var(--caja);border:1px solid var(--borde);border-radius:18px;padding:24px}
.modal h3{margin:0 0 16px}.campo{margin-bottom:12px}
.campo label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gris);margin-bottom:6px;font-weight:600}
.campo input,.campo select{width:100%;background:var(--caja2);border:1px solid var(--borde);color:#fff;border-radius:10px;padding:12px}
.acc{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--azul);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:13px;display:none;z-index:60}
@media(max-width:760px){header{padding:12px 16px;gap:14px}.vivo span{display:none}main{padding:20px 16px}.dosc{grid-template-columns:1fr}}
.sel,.txt{background:var(--caja2);border:1px solid var(--borde);color:#fff;border-radius:10px;padding:11px 12px;font:inherit;width:100%}
.sel:focus,.txt:focus{outline:0;border-color:var(--azul)}.sel option{background:#1a1a1a}
.slot{display:grid;grid-template-columns:1fr 84px 84px 38px;gap:8px;margin-bottom:8px;align-items:center}
.slot-h{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gris);font-weight:600}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.fila{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--borde);flex-wrap:wrap}.fila:first-of-type{border-top:0}
.fila>div{flex:1;min-width:160px}.fila small{color:var(--gris)}
.rec{font-size:10px;font-weight:800;letter-spacing:.5px;color:#002a5c;background:linear-gradient(135deg,#bfeaff,#5ec8f2);padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--azul-s);color:var(--azul);border-radius:999px;padding:6px 6px 6px 12px;font-size:12px;font-weight:700;margin:0 6px 6px 0}
.chip button{background:rgba(47,107,255,.25);border:0;color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1}
.asig{display:flex;gap:8px;margin-top:10px}.asig .sel{flex:1}
.nota{font-size:12px;color:var(--gris);margin:8px 0 0}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
@media(max-width:760px){.slot{grid-template-columns:1fr 70px 70px 34px}}
</style>
</head>
<body>
<header>
  <div class="logo">FIT<b>POWER</b></div>
  <nav id="nav"></nav>
  <div class="vivo"><i class="dot"></i><span>EN LÍNEA</span></div>
  <div class="perfil">
    <button class="avatar" id="avatar" title="Mi perfil"></button>
    <div class="menu" id="menu">
      <p><b id="miNombre"></b>Entrenador</p>
      <button id="salir">Cerrar sesión</button>
    </div>
  </div>
</header>
<main id="vista"></main>
<div id="toast"></div>

<script src="../js/api.js"></script>
<script>
let D = null, tab = 'alumnos', verTodos = false;
let nomRutina = '', slots = [{id:'',series:3,reps:10}];   // estado del formulario "Crear rutina"

const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)}
const vacio = t => `<p class="sub" style="padding:16px">${t}</p>`;

async function cargar(){
  const r = await API.entrenadorTodo();
  if(r.code === 'no_auth'){ window.location.href = 'login.html'; return; }
  if(r.status !== 'success'){ toast(r.message || 'Error al cargar datos'); return; }
  D = r.data;
  $('#avatar').textContent = (D.yo.nombre[0] + (D.yo.apellido||' ')[0]).toUpperCase();
  $('#miNombre').textContent = `${D.yo.nombre} ${D.yo.apellido}`;
  render();
}
async function accion(a, d, ok){
  const r = await API.entrenadorAccion(a, d);
  if(r.status !== 'success'){ toast(r.message || 'No se pudo completar'); return false; }
  if(ok) toast(ok);
  await cargar(); return true;
}

const vistas = {
  alumnos(){
    const lista = D.alumnos.filter(a => verTodos || a.mio);
    return `<div class="barra"><div><h2>Alumnos</h2><p class="sub" style="margin:0">Mirá sus objetivos y asignales rutinas</p></div>
      <button class="btn sec" id="verTodos">${verTodos?'Ver solo mis alumnos':'Ver todos los socios'}</button></div>
    ${lista.length ? lista.map(a => {
      const libres = D.rutinas.filter(r => !a.rutinas.some(x => x.id == r.id));
      return `<div class="card" style="margin-bottom:12px"><div class="barra" style="margin-bottom:10px"><div><strong>${esc(a.nombre)} ${esc(a.apellido)}</strong>${a.mio?'<span class="rec">MI ALUMNO</span>':''}<br>
        <small style="color:var(--gris)">Objetivo: <b style="color:#fff">${esc(a.objetivo||'sin definir')}</b> · Plan: ${esc(a.plan||'—')}</small></div></div>
        <div>${a.rutinas.length ? a.rutinas.map(r=>`<span class="chip">${esc(r.nombre)}<button title="Quitar" data-qu="${a.id}" data-qr="${r.id}">×</button></span>`).join('') : '<small style="color:var(--gris)">Sin rutinas asignadas</small>'}</div>
        <div class="asig"><select class="sel" id="sel-${a.id}" ${libres.length?'':'disabled'}>${libres.length ? libres.map(r=>`<option value="${r.id}">${esc(r.nombre)}</option>`).join('') : '<option>No hay más rutinas para asignar</option>'}</select>
        <button class="btn" data-asig="${a.id}" ${libres.length?'':'disabled'}>Asignar</button></div></div>`}).join('')
      : vacio(verTodos ? 'No hay socios activos.' : 'Todavía nadie te eligió como entrenador. Tocá "Ver todos los socios".')}`;
  },
  rutinas(){
    const opts = i => `<option value="">Elegí un ejercicio...</option>` + D.ejercicios.map(e=>`<option value="${e.id}" ${e.id==slots[i].id?'selected':''}>${esc(e.nombre)} · ${esc(e.grupo_muscular)}</option>`).join('');
    return `<h2>Rutinas</h2><p class="sub">Armá una rutina eligiendo ejercicios ya creados</p>
    <div class="card" style="margin-bottom:14px"><div class="campo"><label>Nombre de la rutina</label><input class="txt" id="nomRutina" value="${esc(nomRutina)}" placeholder="Ej: Pecho y Tríceps"></div>
      <div class="slot"><span class="slot-h">Ejercicio</span><span class="slot-h">Series</span><span class="slot-h">Reps</span><span></span></div>
      ${slots.map((s,i)=>`<div class="slot"><select class="sel" data-s="${i}">${opts(i)}</select>
        <input class="txt" type="number" min="1" max="20" value="${s.series}" data-se="${i}"><input class="txt" type="number" min="1" max="100" value="${s.reps}" data-re="${i}">
        <button class="btn x" data-rs="${i}" ${slots.length<2?'disabled':''}>×</button></div>`).join('')}
      <div class="acc" style="justify-content:space-between"><button class="btn sec" id="addSlot" ${D.ejercicios.length?'':'disabled'}>+ Agregar slot</button><button class="btn" id="guardarR">Crear rutina</button></div>
      <p class="nota">${D.ejercicios.length ? 'La dificultad y el grupo muscular se calculan solos según los ejercicios elegidos.' : 'Primero creá ejercicios en la pestaña Ejercicios.'}</p></div>
    <div class="card">${D.rutinas.length ? D.rutinas.map(r=>`<div class="fila"><div><strong>${esc(r.nombre)}</strong> <span class="rec" style="margin-left:6px">${esc(r.dificultad)} · ${esc(r.grupo_muscular)}</span><br>
      <small>${r.ej.map(x=>esc(x.n)+' ('+esc(x.s)+')').join(' · ') || 'Sin ejercicios'}</small></div><button class="btn x" data-delr="${r.id}">Borrar</button></div>`).join('') : vacio('Todavía no hay rutinas.')}</div>`;
  },
  ejercicios(){
    return `<h2>Ejercicios</h2><p class="sub">Creá los ejercicios que después usás en las rutinas</p>
    <div class="card" style="margin-bottom:14px"><div class="form2">
      <div class="campo"><label>Nombre</label><input class="txt" id="eNombre" placeholder="Press banca"></div>
      <div class="campo"><label>Grupo muscular</label><input class="txt" id="eGrupo" list="grupos" placeholder="Pecho"></div>
      <div class="campo"><label>Tipo de ejercicio</label><input class="txt" id="eTipo" list="tipos" placeholder="Fuerza"></div>
      <div class="campo"><label>Dificultad</label><select class="sel" id="eDif"><option>Principiante</option><option selected>Intermedio</option><option>Avanzado</option></select></div></div>
      <div class="campo"><label>Descripción (opcional)</label><input class="txt" id="eInfo" placeholder="Cómo se hace, consejos..."></div>
      <datalist id="grupos"><option>Pecho</option><option>Espalda</option><option>Pierna</option><option>Glúteos</option><option>Hombros</option><option>Bíceps</option><option>Tríceps</option><option>Core</option><option>Cardio</option><option>Movilidad</option></datalist>
      <datalist id="tipos"><option>Fuerza</option><option>Cardio</option><option>Isometría</option><option>Movilidad</option><option>Rehabilitación</option></datalist>
      <div class="acc"><button class="btn" id="guardarE">Agregar ejercicio</button></div></div>
    <div class="card tabla">${D.ejercicios.length ? `<table><thead><tr><th>Ejercicio</th><th>Grupo</th><th>Tipo</th><th>Dificultad</th><th>En rutinas</th><th></th></tr></thead><tbody>${
      D.ejercicios.map(e=>`<tr><td>${esc(e.nombre)}</td><td>${esc(e.grupo_muscular)}</td><td>${esc(e.tipo_ejercicio)}</td><td>${esc(e.dificultad)}</td><td>${e.usado}</td>
      <td style="text-align:right"><button class="btn x" data-dele="${e.id}">Borrar</button></td></tr>`).join('')}</tbody></table>` : vacio('Todavía no hay ejercicios.')}</div>`;
  }
};
const TABS = [['alumnos','Alumnos'],['rutinas','Rutinas'],['ejercicios','Ejercicios']];
function render(){
  $('#nav').innerHTML = TABS.map(([k,n])=>`<button class="${k===tab?'on':''}" data-t="${k}">${n}</button>`).join('');
  $('#vista').innerHTML = D ? vistas[tab]() : vacio('Cargando...');
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); const d = t ? t.dataset : {};
  if(!e.target.closest('.perfil')) $('#menu').classList.remove('abierto');
  if(!t || t.disabled) return;
  if(d.t){ tab = d.t; return render(); }
  if(t.id==='verTodos'){ verTodos = !verTodos; return render(); }
  if(d.asig) return accion('asignar_rutina', {user_id:+d.asig, rutina_id:+$('#sel-'+d.asig).value}, 'Rutina asignada');
  if(d.qu) return accion('quitar_asignacion', {user_id:+d.qu, rutina_id:+d.qr});
  if(t.id==='addSlot'){ slots.push({id:'',series:3,reps:10}); return render(); }
  if(d.rs !== undefined){ slots.splice(+d.rs,1); return render(); }
  if(t.id==='guardarR'){
    const ok = await accion('crear_rutina', {nombre:nomRutina, items: slots.map(s=>({ejercicio_id:+s.id, series:+s.series, repeticiones:+s.reps}))}, 'Rutina creada');
    if(ok){ nomRutina=''; slots=[{id:'',series:3,reps:10}]; render(); } return;
  }
  if(d.delr){ if(confirm('¿Borrar esta rutina? También se le quita a los socios que la tengan.')) accion('borrar_rutina', {id:+d.delr}); return; }
  if(t.id==='guardarE') return accion('crear_ejercicio', {nombre:$('#eNombre').value, grupo_muscular:$('#eGrupo').value, tipo_ejercicio:$('#eTipo').value, dificultad:$('#eDif').value, info:$('#eInfo').value}, 'Ejercicio agregado');
  if(d.dele){ if(confirm('¿Borrar este ejercicio?')) accion('borrar_ejercicio', {id:+d.dele}); return; }
});
// Mantener el estado del formulario de rutina mientras se escribe
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if(el.id==='nomRutina') nomRutina = el.value;
  else if(d.s !== undefined) slots[+d.s].id = el.value;
  else if(d.se !== undefined) slots[+d.se].series = el.value;
  else if(d.re !== undefined) slots[+d.re].reps = el.value;
});
$('#avatar').onclick = () => $('#menu').classList.toggle('abierto');
$('#salir').onclick = async () => { try{ await API.logout(); }catch(_){} localStorage.clear(); sessionStorage.clear(); window.location.href = 'login.html'; };

// Refresca los alumnos cada 20 s (no toca los formularios)
setInterval(() => { if(tab==='alumnos' && !['SELECT','INPUT'].includes(document.activeElement.tagName)) cargar(); }, 20000);
setInterval(() => API.ping(), 60000);
render(); cargar();
</script>
</body>
</html>
