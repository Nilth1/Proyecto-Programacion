<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Traducción (i18n): va primero para que los textos salgan en el idioma elegido -->
<script src="../js/i18n/en.js?v=5"></script>
<script src="../js/i18n.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitPower · Vista 3D del gimnasio</title>
<!-- Iconito de la pestaña del navegador -->
<link rel="icon" type="image/x-icon" href="../assets/logos/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/logos/favicon-192.png">
<link rel="apple-touch-icon" href="../assets/logos/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--o:#1e6bff;--bg:rgba(14,16,21,.84);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0f14;font-family:'Archivo',system-ui,sans-serif;color:#f3f4f6}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
.panel{background:var(--bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#hud{position:fixed;top:16px;left:16px;width:252px;padding:14px 14px 12px;z-index:5}
/* Botón "Volver" al sitio, igual que en las otras páginas */
.volver{display:inline-flex;align-items:center;gap:8px;margin:0 4px 10px;color:#a0a0a0;text-decoration:none;text-transform:uppercase;font-size:11px;font-weight:600;letter-spacing:1px;transition:color .2s}
.volver:hover{color:var(--o)}
.logo{font-weight:800;font-size:27px;letter-spacing:-.6px;padding:0 4px}
.logo span{color:var(--o)}
.by{font-size:12px;color:#a5abb6;margin-top:2px;padding:0 4px}
.by b{color:#e5e7eb;font-weight:600}
#zones{margin-top:14px;display:flex;flex-direction:column;gap:2px}
#zones button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;background:transparent;border:0;color:#d7dae0;font:600 14px 'Archivo',sans-serif;cursor:pointer;transition:background .15s}
#zones button:hover{background:rgba(255,255,255,.06)}
#zones button.on{background:rgba(30,107,255,.16);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
/* la tarjeta de cada zona va a la derecha, arriba de las herramientas, para no tapar el menú de zonas */
#card{position:fixed;right:16px;bottom:80px;width:370px;padding:18px 18px 16px;z-index:6;transition:opacity .25s,transform .25s}
#card.hidden{opacity:0;transform:translateY(12px);pointer-events:none}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--o);background:rgba(30,107,255,.14);padding:4px 9px;border-radius:999px;margin-bottom:9px}
.tag:empty{display:none}
#card h2{font-size:21px;font-weight:800;margin-bottom:6px;padding-right:24px}
#card p{font-size:14px;line-height:1.5;color:#c9cdd4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chips span{font-size:12px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.07);color:#dfe2e7}
.meta{font-size:12px;color:#8d939e;margin-top:10px}
#close{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:8px;border:0;background:rgba(255,255,255,.07);color:#cfd3da;font-size:18px;line-height:1;cursor:pointer}
#close:hover{background:rgba(255,255,255,.14)}
#tools{position:fixed;right:16px;bottom:16px;display:flex;gap:4px;padding:6px;z-index:5}
#tools button{padding:9px 12px;border-radius:10px;border:0;background:transparent;color:#cfd3da;font:600 13px 'Archivo',sans-serif;cursor:pointer;white-space:nowrap;transition:background .15s}
#tools button:hover{background:rgba(255,255,255,.07)}
#tools button.on{background:var(--o);color:#fff}
#hint{position:fixed;top:66px;right:16px;font-size:12px;color:#e4e7ec;padding:9px 13px;z-index:5;border-radius:12px}
#legend{position:fixed;right:16px;top:108px;font-size:12px;padding:10px 13px;z-index:5;border-radius:12px;display:flex;flex-direction:column;gap:6px;color:#d7dae0}
#legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-2px}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:15px;color:#c9cdd4;z-index:20}
/* Botón de traducir del sitio: acá va arriba a la derecha para no tapar la tarjeta ni las herramientas */
body #i18n-btn{left:auto;bottom:auto;top:16px;right:16px}
@media (max-width:760px){
  #hud{left:8px;right:8px;top:8px;width:auto;padding:10px 10px 8px}
  .volver{margin-bottom:6px}
  .logo{font-size:20px}.by{font-size:11px}
  #zones{flex-direction:row;overflow-x:auto;margin-top:8px;scrollbar-width:none}
  #zones button{white-space:nowrap;width:auto;padding:7px 10px;font-size:13px}
  #hint,#legend{display:none}
  #card{left:8px;right:8px;width:auto;bottom:66px;padding:14px}
  #card p{font-size:13px}
  #tools{left:8px;right:8px;bottom:8px;overflow-x:auto}
  body #i18n-btn{top:16px;right:16px}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud" class="panel">
  <a href="../../index.html" class="volver"><span>←</span><span>Volver</span></a>
  <div class="logo">Fit<span>Power</span></div>
  <div class="by">Vista 3D del gimnasio · por <b>NorthStack</b></div>
  <nav id="zones"></nav>
</div>

<div id="hint" class="panel">Arrastrá para girar · rueda o pellizco para zoom · clic en una zona</div>
<div id="legend" class="panel">
  <div><i style="background:#d4a017"></i>Exclusivo plan más alto (5)</div>
  <div><i style="background:#2f6fd6"></i>Planes superiores (20)</div>
</div>

<div id="card" class="panel hidden">
  <button id="close" aria-label="Cerrar">×</button>
  <div class="tag" id="cTag"></div>
  <h2 id="cTitle"></h2>
  <p id="cDesc"></p>
  <div class="chips" id="cChips"></div>
  <div class="meta" id="cMeta"></div>
</div>

<div id="tools" class="panel">
  <button data-t="overview">Vista general</button>
  <button data-t="walls" class="on">Paredes</button>
  <button data-t="labels" class="on">Etiquetas</button>
  <button data-t="night">Noche</button>
  <button data-t="rotate">Giro auto</button>
</div>

<div id="err">No se pudo cargar el motor 3D (three.js). Revisá la conexión y recargá la página.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
function initFP() {
if (!window.THREE || !THREE.OrbitControls) { document.getElementById('err').style.display = 'flex'; return; }

// Traduce los textos que se dibujan ADENTRO del 3D (carteles y etiquetas), que el traductor de la página no ve
const T = s => (window.I18N && I18N.t) ? I18N.t(s) : s;

/* ---------- Datos de las zonas ---------- */
const ZONES = [
  { id:'recepcion', name:'Recepción', color:'#1e6bff', floor:0xd3ccc0, x0:-10.5, x1:0, z0:-13.5, z1:-11.2,
    tag:'Funcionalidad extra · Ingreso biométrico',
    desc:'Entrada del gimnasio: mostrador de atención y molinete con lector de huella. El socio apoya el dedo, el sistema chequea que la cuota esté al día (se paga desde la web) y libera el molinete. Fijate en el socio animado: cuando lo escanea, el lector se pone verde y el brazo se abre.',
    items:['Mostrador','Molinete + lector de huella','Logo FitPower'] },
  { id:'musculacion', name:'Musculación', color:'#ffb020', floor:0x2a2c31, x0:-17.5, x1:5.5, z0:-11.2, z1:-1,
    desc:'Sala principal, pegada a la recepción: racks de sentadilla, bancos de press, máquinas guiadas, bancos y mancuernas, con pared de espejos.',
    items:['Racks de sentadilla','Bancos de press','Máquinas','Bancos','Mancuernas'] },
  { id:'futbol', name:'Fútbol', color:'#3ddc84', floor:0x3f8a4a, x0:-28, x1:-17.5, z0:-10.5, z1:1.8,
    desc:'Ala izquierda con canchita de fútbol de césped sintético, arcos en las puntas y bancos a los costados.',
    items:['Cancha de césped sintético','2 arcos','Bancos'] },
  { id:'cardio', name:'Cardio', color:'#4da3ff', floor:0x3a4252, x0:-17.5, x1:-6, z0:1.8, z1:15,
    desc:'Zona de cardio con cintas, bicicletas y un remo.',
    items:['4 cintas','4 bicicletas','1 remo'] },
  { id:'maquinas', name:'Máquinas', color:'#c86bff', floor:0x2f3238, x0:-6, x1:5.5, z0:1.8, z1:15,
    desc:'Sala de máquinas guiadas al lado de cardio, en tres filas.',
    items:['15 máquinas guiadas'] },
  { id:'banosH', name:'Baños H', color:'#7dd3d8', floor:0xc9d3d9, x0:5.5, x1:16.3, z0:-10.5, z1:1.75,
    desc:'Baño de hombres: cubículos con inodoro, mingitorios y mesada con lavatorios y espejo. Se entra desde el pasillo y comunica con el vestuario.',
    items:['4 cubículos','Mingitorios','Lavatorios'] },
  { id:'vestH', name:'Vestuario H', color:'#5fb8ff', floor:0xbfc9cf, x0:16.3, x1:27.5, z0:-10.5, z1:1.75,
    desc:'Vestuario de hombres con lockers, bancos y duchas.',
    items:['Lockers','Bancos','Duchas'] },
  { id:'banosM', name:'Baños M', color:'#ff8fc8', floor:0xc9d3d9, x0:5.5, x1:16.3, z0:1.75, z1:15,
    desc:'Baño de mujeres: cubículos con inodoro y mesada con lavatorios y espejo. Se entra desde el pasillo y comunica con el vestuario.',
    items:['5 cubículos','Lavatorios'] },
  { id:'vestM', name:'Vestuario M', color:'#ff6fae', floor:0xbfc9cf, x0:16.3, x1:27.5, z0:1.75, z1:15,
    desc:'Vestuario de mujeres con lockers, bancos y duchas.',
    items:['Lockers','Bancos','Duchas'] },
  { id:'estacionamiento', name:'Estacionamiento', color:'#ffd34d', floor:0x3a3c41, x0:-20, x1:20, z0:-33, z1:-16,
    tag:'Funcionalidad extra · Estacionamiento por plan',
    desc:'25 lugares frente a la entrada: 20 para socios de los planes superiores (azul) y 5 exclusivos del plan más alto (dorado), los más cerca de la puerta. El sistema habilita el lugar según el plan que tenga cada socio.',
    items:['20 lugares planes superiores','5 lugares plan más alto','Barrera de acceso','Iluminación'] }
];
const ZMAP = {}; ZONES.forEach(z => ZMAP[z.id] = z);

/* ---------- Renderer, escena, cámara ---------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const DAY_BG = new THREE.Color(0xc9dcea), NIGHT_BG = new THREE.Color(0x0a0f1d);
scene.background = DAY_BG.clone();
scene.fog = new THREE.Fog(0xc9dcea, 110, 230);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 600);
const OVERVIEW = { pos:new THREE.Vector3(8, 52, 50), target:new THREE.Vector3(0, 0, -6) };
camera.position.set(70, 85, 110);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(OVERVIEW.target);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 5; controls.maxDistance = 140;
controls.autoRotateSpeed = 0.6;
controls.update();

/* ---------- Luces ---------- */
const hemi = new THREE.HemisphereLight(0xeaf4ff, 0x5a5040, 0.65); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 0.95);
sun.position.set(35, 55, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-60, right:60, top:60, bottom:-60, near:1, far:160 });
sun.shadow.bias = -0.0006;
scene.add(sun);
const nightLights = [];
function nightLight(x, y, z, color, dist) {
  const l = new THREE.PointLight(color || 0xfff1dc, 0, dist || 22, 1.6);
  l.position.set(x, y, z); scene.add(l); nightLights.push(l); return l;
}

/* ---------- Materiales y helpers ---------- */
function M(color, o) { return new THREE.MeshStandardMaterial(Object.assign({ color:color, roughness:0.75, metalness:0.05 }, o || {})); }
const mat = {
  dark:M(0x1c1f24), black:M(0x111214, {roughness:0.9}), steel:M(0xa3abb4, {metalness:0.7, roughness:0.3}),
  orange:M(0x1e6bff, {roughness:0.5}), pad:M(0x22252b, {roughness:0.6}), padOrange:M(0x1a56d6, {roughness:0.6}),
  wood:M(0xb5835a, {roughness:0.6}), plyo:M(0xc49a6c, {roughness:0.7}), plate:M(0x15161a, {roughness:0.6}),
  stack:M(0x2e3138, {metalness:0.4, roughness:0.4}), belt:M(0x0d0d0f, {roughness:1}),
  screen:M(0x0b1a2a, {emissive:0x2a7bff, emissiveIntensity:0.55}),
  concrete:M(0xdedad3, {roughness:0.95}), partition:M(0xebe7df, {roughness:0.9}),
  glass:M(0xaed8f0, {transparent:true, opacity:0.26, roughness:0.05, metalness:0.2, depthWrite:false}),
  mirror:M(0xd5e5ee, {metalness:0.25, roughness:0.08}),
  locker:M(0x4b6a88, {roughness:0.5, metalness:0.3}), tile:M(0xe9eef1, {roughness:0.4}),
  sofa:M(0x37414f), plant:M(0x3f8f4f), pot:M(0xece6dc), leaf:M(0x4d9a52), trunk:M(0x6b4a33),
  grass:M(0x8fac6e, {roughness:1}), asphalt:M(0x34363b, {roughness:0.95}), sidewalk:M(0xc9c5bd, {roughness:0.95}),
  line:M(0xf4f4f4, {roughness:0.6}), gold:M(0xd4a017, {roughness:0.55}), blue:M(0x2f6fd6, {roughness:0.55}),
  neon:M(0x3d8bff, {emissive:0x3d8bff, emissiveIntensity:0.9}),
  lamp:M(0xfff4d6, {emissive:0xfff1c8, emissiveIntensity:0.2}),
  carGlass:M(0x1d2a35, {metalness:0.6, roughness:0.2}),
  headlight:M(0xfff7d6, {emissive:0xfff3c4, emissiveIntensity:0.3}), taillight:M(0xa61b1b, {emissive:0xff2a2a, emissiveIntensity:0.3}),
  skin:M(0xd9a27e), shirt:M(0x1e6bff), pants:M(0x22252b),
  reader:M(0x0e1a24, {emissive:0x22aaff, emissiveIntensity:1}), stripe:M(0x1e6bff, {roughness:0.5}),
  rope:M(0x2b2b2b, {roughness:0.9}), mat1:M(0x2a5bd7), mat2:M(0x1f2a3d)
};
const spinners = [];

function add(p, geo, m, x, y, z) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); p.add(o); return o; }
function box(p, w, h, d, m, x, y, z) { return add(p, new THREE.BoxGeometry(w, h, d), m, x, y, z); }
function cyl(p, r, h, m, x, y, z, seg) { return add(p, new THREE.CylinderGeometry(r, r, h, seg || 20), m, x, y, z); }
function grp(p, x, z, rot, y) { const g = new THREE.Group(); g.position.set(x, y === undefined ? 0.1 : y, z); g.rotation.y = rot || 0; p.add(g); return g; }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
function drawLogo(ctx, cx, cy, size) {
  ctx.font = '800 ' + size + 'px Archivo, Arial, sans-serif'; ctx.textBaseline = 'middle';
  const wa = ctx.measureText('Fit').width, wb = ctx.measureText('Power').width, x0 = cx - (wa + wb) / 2;
  ctx.fillStyle = '#ffffff'; ctx.fillText('Fit', x0, cy); ctx.fillStyle = '#1e6bff'; ctx.fillText('Power', x0 + wa, cy);
}

/* ---------- Equipamiento ---------- */
function treadmill(p, x, z, r) {
  const g = grp(p, x, z, r);
  box(g, 0.9, 0.22, 2.0, mat.dark, 0, 0.11, 0);
  box(g, 0.62, 0.02, 1.75, mat.belt, 0, 0.23, -0.05);
  [-0.4, 0.4].forEach(s => { box(g, 0.06, 1.2, 0.06, mat.steel, s, 0.7, 0.9); box(g, 0.05, 0.05, 0.55, mat.steel, s, 1.05, 0.62); });
  const con = box(g, 0.9, 0.32, 0.18, mat.dark, 0, 1.38, 0.92); con.rotation.x = -0.35;
  const scr = box(g, 0.5, 0.2, 0.02, mat.screen, 0, 1.4, 0.82); scr.rotation.x = -0.35;
}
function bike(p, x, z, r, frame, y) {
  const g = grp(p, x, z, r, y);
  box(g, 0.55, 0.07, 1.1, mat.dark, 0, 0.035, 0);
  const f = box(g, 0.08, 0.85, 0.08, frame || mat.orange, 0, 0.45, -0.15); f.rotation.x = 0.25;
  box(g, 0.26, 0.07, 0.32, mat.black, 0, 0.92, -0.3);
  const h = box(g, 0.07, 0.85, 0.07, mat.steel, 0, 0.5, 0.33); h.rotation.x = -0.2;
  box(g, 0.5, 0.05, 0.05, mat.black, 0, 0.95, 0.42);
  const pv = new THREE.Group(); pv.position.set(0, 0.35, 0.45); g.add(pv);
  const fw = cyl(pv, 0.24, 0.06, mat.steel, 0, 0, 0, 24); fw.rotation.z = Math.PI / 2;
  box(pv, 0.07, 0.36, 0.05, frame || mat.orange, 0, 0, 0);
  pv.userData.speed = 4 + Math.random() * 3; spinners.push(pv);
  return g;
}
function rower(p, x, z, r) {
  const g = grp(p, x, z, r);
  box(g, 0.22, 0.1, 2.4, mat.steel, 0, 0.25, 0);
  box(g, 0.45, 0.2, 0.25, mat.dark, 0, 0.1, -1.1); box(g, 0.45, 0.2, 0.25, mat.dark, 0, 0.1, 1.05);
  const fw = cyl(g, 0.28, 0.24, mat.black, 0, 0.45, 1.05, 20); fw.rotation.z = Math.PI / 2;
  box(g, 0.32, 0.08, 0.36, mat.black, 0, 0.34, -0.3);
  box(g, 0.4, 0.04, 0.2, mat.dark, 0, 0.42, 0.55);
}
function bench(p, x, z, r) {
  const g = grp(p, x, z, r);
  box(g, 0.32, 0.1, 1.2, mat.pad, 0, 0.45, 0);
  box(g, 0.28, 0.4, 0.06, mat.steel, 0, 0.2, -0.48); box(g, 0.28, 0.4, 0.06, mat.steel, 0, 0.2, 0.48);
  return g;
}
function barbell(p, x, y, z) {
  const g = new THREE.Group(); g.position.set(x, y, z); p.add(g);
  const b = cyl(g, 0.025, 2.2, mat.steel, 0, 0, 0, 10); b.rotation.z = Math.PI / 2;
  [-0.86, -0.79, 0.79, 0.86].forEach(px => { const pl = cyl(g, 0.22, 0.05, mat.plate, px, 0, 0, 24); pl.rotation.z = Math.PI / 2; });
  return g;
}
function benchPress(p, x, z, r) {
  const g = bench(p, x, z, r);
  [-0.55, 0.55].forEach(s => box(g, 0.06, 1.15, 0.06, mat.black, s, 0.575, -0.55));
  barbell(g, 0, 1.1, -0.55);
}
function squatRack(p, x, z, r) {
  const g = grp(p, x, z, r);
  box(g, 2.4, 0.05, 2.6, mat.wood, 0, 0.025, 0);
  [[-0.6, -0.5], [0.6, -0.5], [-0.6, 0.5], [0.6, 0.5]].forEach(a => box(g, 0.08, 2.3, 0.08, mat.black, a[0], 1.15, a[1]));
  box(g, 1.3, 0.08, 0.08, mat.black, 0, 2.3, -0.5); box(g, 1.3, 0.08, 0.08, mat.black, 0, 2.3, 0.5);
  box(g, 0.08, 0.08, 1.08, mat.black, -0.6, 2.3, 0); box(g, 0.08, 0.08, 1.08, mat.black, 0.6, 2.3, 0);
  barbell(g, 0, 1.35, 0.45);
}

  const txt = (t, col) => canvasTex(1024, 96, (c, W, Hh) => { c.fillStyle = col; c.font = '800 64px Archivo, Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(t, W / 2, Hh / 2 + 3); });
  const t1 = add(g, new THREE.PlaneGeometry(12.4, 1.16), new THREE.MeshBasicMaterial({ map:txt(T('EXCLUSIVO · PLAN MÁS ALTO'), '#ffcf3a'), transparent:true }), -5.2, 0.13, -22.9); t1.rotation.x = -Math.PI / 2;
  const t2 = add(g, new THREE.PlaneGeometry(12.4, 1.16), new THREE.MeshBasicMaterial({ map:txt(T('PLANES SUPERIORES'), '#7fb0ff'), transparent:true }), 0, 0.13, -26.1); t2.rotation.x = -Math.PI / 2;
  const colors = [0xc7ccd3, 0x1f2b44, 0xa81c1c, 0xf0efe9, 0x2d2f33, 0x2a5c8a, 0x6d7278, 0x1e4fa8, 0x184a3a, 0xe9e3d0];
  [[0, 0], [2, 0], [3, 0], [4, 0], [6, 0], [9, 0], [12, 0], [14, Math.PI], [15, Math.PI], [18, Math.PI], [21, Math.PI], [23, Math.PI]]
    .forEach((c, i) => car(g, spots[c[0]].x, spots[c[0]].z, c[1], colors[i % colors.length]));
  const b = grp(g, 19.3, -33.6, 0); box(b, 0.35, 1.1, 0.35, mat.stripe, 0, 0.55, 0); box(b, 0.25, 0.4, 0.15, mat.dark, -0.1, 1.0, -0.5);
  box(b, 5.4, 0.1, 0.1, mat.stripe, -2.75, 1.0, 0);
  for (let i = 0; i < 5; i++) box(b, 0.5, 0.11, 0.11, mat.line, -0.8 - i * 1.0, 1.0, 0);
  lampPost(g, -10, -24.5); lampPost(g, 6, -24.5);
})();

/* ---------- Luces nocturnas interiores ---------- */
[[-6, -6], [-5, -12.3], [-22.7, -4.3], [-11.7, 8.4], [0, 8.4], [11, -4.4], [22, -4.4], [11, 8.4], [22, 8.4]].forEach(p => nightLight(p[0], 3.2, p[1], 0xfff1dc, 18));
/* ---------- Etiquetas ---------- */
const labels = new THREE.Group(); scene.add(labels);
function makeLabel(title, color) {
  const tex = canvasTex(640, 140, (x) => {
    // si el nombre es largo (por ejemplo en inglés) se achica la letra para que entre en la etiqueta
    let fs = 54;
    x.font = '800 ' + fs + 'px Archivo, Arial, sans-serif';
    while (x.measureText(title).width + 100 > 630 && fs > 30) { fs -= 2; x.font = '800 ' + fs + 'px Archivo, Arial, sans-serif'; }
    const tw = x.measureText(title).width, W = Math.min(630, tw + 100), X = (640 - W) / 2;
    roundRect(x, X, 20, W, 100, 50); x.fillStyle = 'rgba(16,18,24,0.9)'; x.fill();
    x.fillStyle = color; x.beginPath(); x.arc(X + 48, 70, 13, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.fillText(title, X + 74, 73);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, depthTest:false, transparent:true }));
  s.scale.set(7.2, 1.575, 1); s.renderOrder = 10; return s;
}
ZONES.forEach(z => { const s = makeLabel(T(z.name), z.color); s.position.set(z.cx, z.id === 'recepcion' ? 5.6 : 4.6, z.id === 'recepcion' ? z.cz - 1.2 : z.cz); labels.add(s); });

/* ---------- Socio animado ---------- */
const person = new THREE.Group(); scene.add(person);
cyl(person, 0.11, 0.8, mat.pants, -0.1, 0.4, 0, 8); cyl(person, 0.11, 0.8, mat.pants, 0.1, 0.4, 0, 8);
add(person, new THREE.CylinderGeometry(0.24, 0.2, 0.62, 12), mat.shirt, 0, 1.11, 0);
add(person, new THREE.SphereGeometry(0.15, 16, 12), mat.skin, 0, 1.6, 0);
box(person, 0.3, 0.3, 0.1, mat.dark, 0, 1.15, -0.22);
const PATH = [[-6.5, -20.2], [-6.5, -16.4], [-6, -14.9], [-6, -12.75, 'scan'], [-6, -10.6], [-6, -7.4], [-8.5, -4.6, 'end']];
let pIdx = 0, pWait = 0.8, scanT = -1;
person.position.set(PATH[0][0], 0.1, PATH[0][1]);

/* ---------- Sombras ---------- */
scene.traverse(o => { if (o.isMesh) { const tr = o.material && o.material.transparent; o.castShadow = !tr && o !== ground; o.receiveShadow = true; } });

/* ---------- UI ---------- */
const nav = document.getElementById('zones');
ZONES.forEach(z => {
  const b = document.createElement('button'); b.dataset.id = z.id;
  b.innerHTML = '<span class="dot" style="background:' + z.color + '"></span>' + z.name;
  b.onclick = () => select(z.id, true); nav.appendChild(b);
});
const card = document.getElementById('card');
let selected = null, hovered = null;

function paintFloors() {
  ZONES.forEach(z => z.floorMat.emissive.setHex(z.id === selected ? 0x0f2550 : z.id === hovered ? 0x0a1835 : 0x000000));
}
function zoneView(z) {
  const s = Math.max(z.w, z.d), k = camera.aspect < 1 ? 1.7 : 1;
  const d = (s * 0.95 + 7) * k;
  return { pos:new THREE.Vector3(z.cx + d * 0.42, d * 0.78, z.cz + d * 0.78), target:new THREE.Vector3(z.cx, 0.5, z.cz) };
}
let fly = null;
function flyTo(v) { fly = { pos:v.pos.clone(), target:v.target.clone() }; }
function select(id, move) {
  selected = id; paintFloors();
  [...nav.children].forEach(b => b.classList.toggle('on', b.dataset.id === id));
  if (!id) { card.classList.add('hidden'); return; }
  const z = ZMAP[id];
  document.getElementById('cTag').textContent = z.tag || '';
  document.getElementById('cTitle').textContent = z.name;
  document.getElementById('cDesc').textContent = z.desc;
  document.getElementById('cChips').innerHTML = z.items.map(i => '<span>' + i + '</span>').join('');
  // superficie redondeada a 1 decimal (si no, JavaScript muestra cosas como 24.150000000000002)
  document.getElementById('cMeta').textContent = 'Superficie aprox.: ' + z.w + ' × ' + z.d + ' m (' + (Math.round(z.w * z.d * 10) / 10) + ' m²)';
  card.classList.remove('hidden');
  if (move) flyTo(zoneView(z));
}
document.getElementById('close').onclick = () => select(null);

const tools = document.getElementById('tools');
let night = false, nightT = 0;
tools.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = b.dataset.t;
  if (t === 'overview') { select(null); flyTo(OVERVIEW); }
  if (t === 'walls') { walls.visible = !walls.visible; b.classList.toggle('on', walls.visible); }
  if (t === 'labels') { labels.visible = !labels.visible; b.classList.toggle('on', labels.visible); }
  if (t === 'night') { night = !night; b.classList.toggle('on', night); }
  if (t === 'rotate') { controls.autoRotate = !controls.autoRotate; b.classList.toggle('on', controls.autoRotate); }
});
controls.addEventListener('start', () => { fly = null; });

/* ---------- Picking ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((ev.clientX - r.left) / r.width) * 2 - 1; mouse.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(pickables, true);
  for (const h of hits) { let o = h.object; while (o && !o.userData.zone) o = o.parent; if (o) return o.userData.zone; }
  return null;
}
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) { const id = pick(e); select(id, !!id); }
  down = null;
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || e.buttons) return;
  const id = pick(e);
  if (id !== hovered) { hovered = id; paintFloors(); renderer.domElement.style.cursor = id ? 'pointer' : 'grab'; }
});
renderer.domElement.style.cursor = 'grab';

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

/* ---------- Bucle ---------- */
const clock = new THREE.Clock();
const fogDay = new THREE.Color(0xc9dcea), fogNight = new THREE.Color(0x0a0f1d);
const disc = window._fp.disc, armT = window._fp.arm;
function updatePerson(dt, t) {
  let moving = false;
  if (pWait > 0) {
    pWait -= dt;
    if (pWait <= 0 && PATH[pIdx][2] === 'end') { pIdx = 0; person.position.set(PATH[0][0], 0.1, PATH[0][1]); pWait = 0.8; }
  } else if (pIdx < PATH.length - 1) {
    const n = PATH[pIdx + 1], dx = n[0] - person.position.x, dz = n[1] - person.position.z, dist = Math.hypot(dx, dz), step = 1.7 * dt;
    person.rotation.y = Math.atan2(dx, dz);
    if (dist <= step) {
      person.position.x = n[0]; person.position.z = n[1]; pIdx++;
      if (n[2] === 'scan') { pWait = 1.7; scanT = 0; }
      if (n[2] === 'end') pWait = 1.4;
    } else { person.position.x += dx / dist * step; person.position.z += dz / dist * step; moving = true; }
  }
  person.position.y = 0.1 + (moving ? Math.abs(Math.sin(t * 9)) * 0.05 : 0);
  if (scanT >= 0) { scanT += dt; if (scanT > 3.4) scanT = -1; }
  const ok = scanT > 0.5 && scanT < 3.4, open = scanT > 0.7 && scanT < 3.2;
  disc.material.emissive.setHex(ok ? 0x22ff77 : 0x22aaff);
  disc.material.emissiveIntensity = ok ? 1.4 : 0.6 + 0.4 * Math.sin(t * 4);
  armT.rotation.y += ((open ? -Math.PI / 2 : 0) - armT.rotation.y) * Math.min(1, dt * 6);
}
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  spinners.forEach(s => s.rotation.x += dt * s.userData.speed);
  updatePerson(dt, t);
  nightT += ((night ? 1 : 0) - nightT) * Math.min(1, dt * 3);
  hemi.intensity = 0.65 - 0.5 * nightT; sun.intensity = 0.95 - 0.87 * nightT;
  scene.background.copy(DAY_BG).lerp(NIGHT_BG, nightT); scene.fog.color.copy(fogDay).lerp(fogNight, nightT);
  nightLights.forEach(l => l.intensity = 1.25 * nightT);
  signMat.emissiveIntensity = 0.12 + 0.9 * nightT; mat.lamp.emissiveIntensity = 0.2 + 1.3 * nightT;
  mat.neon.emissiveIntensity = 0.9 + 0.6 * nightT; mat.headlight.emissiveIntensity = 0.3 + 0.7 * nightT;
  if (fly) {
    camera.position.lerp(fly.pos, 0.065); controls.target.lerp(fly.target, 0.065);
    if (camera.position.distanceTo(fly.pos) < 0.05 && controls.target.distanceTo(fly.target) < 0.05) fly = null;
  }

}
flyTo(OVERVIEW);
loop();
}
var _fpStarted = false;
function startFP() { if (_fpStarted) return; _fpStarted = true; initFP(); }
try { Promise.race([document.fonts.load('800 54px Archivo'), new Promise(function (r) { setTimeout(r, 1500); })]).then(startFP, startFP); } catch (e) { startFP(); }
