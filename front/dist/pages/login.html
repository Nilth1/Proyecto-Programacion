<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Traducción (i18n): va primero para que fechas y textos salgan en el idioma elegido -->
<script src="../js/i18n/en.js?v=5"></script>
<script src="../js/i18n.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FitPower</title>
  <!-- Iconito de la pestaña del navegador -->
  <link rel="icon" type="image/x-icon" href="../assets/logos/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/logos/favicon-192.png">
  <link rel="apple-touch-icon" href="../assets/logos/apple-touch-icon.png">

  <link rel="stylesheet" href="../css/login.css?v=2">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <a href="../../index.html" class="back-link d-inline-flex align-items-center gap-2 text-decoration-none mb-5">
    <span class="back-arrow">←</span>
    <span class="text-uppercase small fw-semibold">Volver</span>
  </a>

  <div class="tarjeta">

    <h1 class="titulo">
      <span class="blanco">FIT</span><span class="azul">POWER</span>
    </h1>

    <form id="loginForm">
      <div class="renglon">
        <label for="mail">Email</label>
        <input id="mail" type="email" placeholder="lucas@gmail.com" required>
      </div>

      <div class="renglon">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" placeholder="••••••••" required>
      </div>

      <div class="quienentra">
        <label class="letrero">Ingresar como</label>
        <div class="opciones">

          <button type="button" class="opcion elegida" data-quien="socio">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
            </svg>
            <span>Socio</span>
          </button>

          <button type="button" class="opcion" data-quien="entrenador">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="3.5" width="9" height="9" rx="2.5"/>
              <rect x="12.5" y="11.5" width="9" height="9" rx="2.5"/>
            </svg>
            <span>Entrenador</span>
          </button>

          <button type="button" class="opcion" data-quien="administrador">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/>
            </svg>
            <span>Administrador</span>
          </button>

        </div>
      </div>

      <button type="submit" class="botonentrar">Ingresar</button>
    </form>

    <!-- Cartelito con los usuarios de prueba: al tocar uno se completa el login solo -->
    <div class="demos">
      <p class="demos-titulo">Usuarios de prueba</p>
      <p class="demos-ayuda">Tocá uno y se completan los datos solos</p>
      <button type="button" class="demo" data-mail="lucas@gmail.com" data-clave="1234" data-rol="socio">
        <span class="demo-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></span>
        <span class="demo-datos">
          <b>Lucas <em>Socio</em></b>
          <small>lucas@gmail.com</small>
          <small>Contraseña: <strong>1234</strong></small>
        </span>
        <span class="demo-flecha">→</span>
      </button>
      <button type="button" class="demo" data-mail="SofiaE@fitpower.com" data-clave="1234" data-rol="entrenador">
        <span class="demo-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="9" height="9" rx="2.5"/><rect x="12.5" y="11.5" width="9" height="9" rx="2.5"/></svg></span>
        <span class="demo-datos">
          <b>Sofía <em>Entrenador</em></b>
          <small>SofiaE@fitpower.com</small>
          <small>Contraseña: <strong>1234</strong></small>
        </span>
        <span class="demo-flecha">→</span>
      </button>
      <button type="button" class="demo" data-mail="admin@fitpower.com" data-clave="123456" data-rol="administrador">
        <span class="demo-ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/></svg></span>
        <span class="demo-datos">
          <b>Admin <em>Administrador</em></b>
          <small>admin@fitpower.com</small>
          <small>Contraseña: <strong>123456</strong></small>
        </span>
        <span class="demo-flecha">→</span>
      </button>
    </div>

    <p class="abajo">v1.0.0 — FITPOWER Gym OS</p>

  </div>

  <script src="../js/api.js"></script>
  <script>
    // Configuración de botones de selección de rol
    const opciones = document.querySelectorAll('.opcion');
    opciones.forEach(op => {
      op.addEventListener('click', () => {
        opciones.forEach(o => o.classList.remove('elegida'));
        op.classList.add('elegida');
      });
    });

    // Usuarios de prueba: al tocar uno se completan el email, la contraseña y el rol
    document.querySelectorAll('.demo').forEach(demo => {
      demo.addEventListener('click', () => {
        document.getElementById('mail').value = demo.dataset.mail;
        document.getElementById('clave').value = demo.dataset.clave;
        document.querySelector(`.opcion[data-quien="${demo.dataset.rol}"]`).click();
        document.querySelectorAll('.demo').forEach(d => d.classList.toggle('usado', d === demo));
      });
    });

    // Captura del formulario de login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const mail = document.getElementById('mail').value.trim();
      const clave = document.getElementById('clave').value.trim();
      const botonRol = document.querySelector('.opcion.elegida');
      const rolSeleccionado = botonRol ? botonRol.dataset.quien : 'socio';

      try {
        const respuesta = await API.login(mail, clave, rolSeleccionado);
        console.log("Respuesta de la API:", respuesta);

        if (respuesta.status === 'success') {
          // Redirecciona según el rol elegido ('socio.html', 'entrenador.html' o 'administrador.html')
          window.location.href = `${rolSeleccionado}.html`;
        } else {
          alert('Error: ' + (respuesta.message || 'Credenciales incorrectas'));
        }
      } catch (err) {
        console.error("Error al conectar:", err);
        alert('Ocurrió un error de conexión con la API.');
      }
    });
  </script>
</body>
</html>
