<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPower - Plan</title>
    <link rel="icon" type="image/x-icon" href="../assets/logos/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

   
    <link rel="stylesheet" href="../css/planes.css"> <!-- css planes -->
    <link rel="stylesheet" href="../css/mobile.css"> <!-- css mobile -->
</head>
<body>

<header class="w-100 py-3 bg-black">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-uppercase fs-3" href="../../index.html">
                FIT<span class="text-primary">POWER</span>
            </a>

            <!-- menu hamburguesa -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>   
            </button>

            <!-- links header -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-lg-3 text-center my-3 my-lg-0">
                    <li class="nav-item"><a class="nav-link" href="../../index.html">INICIO</a></li>
                    <li class="nav-item"><a class="nav-link" href="entrenadores.html">ENTRENADORES</a></li>
                    <li class="nav-item"><a class="nav-link active" href="planes.html">PLANES</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">CONTACTO</a></li>
                </ul>
                <div class="text-center">
                    <a href="../pages/login.html" class="btn btn-primary px-4 py-2 rounded-1 fw-semibold text-uppercase">Unirme</a>
                </div>
            </div>
        </div>
    </nav>
</header>

<main>
    <section class="plans-section bg-black text-white py-5">
        <div class="container py-4">

            <!-- boton volver -->
            <a href="../../index.html" class="back-link d-inline-flex align-items-center gap-2 text-decoration-none mb-5">
                <span class="back-arrow">←</span>
                <span class="text-uppercase small fw-semibold">Volver</span>
            </a>

            
            <div id="plan-detalle"></div>
        </div>
    </section>
</main>

<footer>
   
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="../js/script.js"></script> <!-- javascript nuestro -->

<script>
    //array con la info de los 3 planes
    const planes = [
        {
            id: "basic",
            nombre: "Basic",
            descripcion: "Ideal para comenzar",
            precio: "$1999",
            destacado: false,
            beneficios: [
                "Acceso a sala de musculación",
                "Casillero incluido"
            ]
        },
        {
            id: "elite",
            nombre: "Elite",
            descripcion: "El plan más popular de FitPower",
            precio: "$2700",
            destacado: true,
            beneficios: [
                "Acceso a sala de musculación",
                "Acceso a funcionales",
                "Acceso a elegir entrenador",
                "Casillero incluido"
            ]
        },
        {
            id: "power",
            nombre: "Power",
            descripcion: "Para quienes van en serio",
            precio: "$3500",
            destacado: false,
            beneficios: [
                "Acceso a musculación y funcionales",
                "Acceso a elegir entrenador",
                "Guia nutricional personalizada",
                "Reservar estacionamiento privado",
                "Casillero incluido"
            ]
        }
    ];

    
    const params = new URLSearchParams(window.location.search);
    const planId = params.get("plan") || "basic"; 

   
    const planElegido = planes.find(p => p.id === planId);

    const contenedor = document.getElementById("plan-detalle");

    if (planElegido) {
        contenedor.innerHTML = `
            <div class="row justify-content-center">
                <div class="col-lg-6 col-xl-5">
                    <div class="plan-detail-card ${planElegido.destacado ? 'plan-detail-featured' : ''} rounded-4 p-5 position-relative">
                        ${planElegido.destacado ? '<span class="plan-badge">Más popular</span>' : ''}

                        <span class="plan-eyebrow text-uppercase fw-bold small d-block mb-2">Plan seleccionado</span>
                        <h1 class="plan-name fw-black text-uppercase mb-2">${planElegido.nombre}</h1>
                        <p class="${planElegido.destacado ? 'text-white text-opacity-75' : 'text-secondary'} mb-4">${planElegido.descripcion}</p>

                        <div class="d-flex align-items-baseline mb-4 pb-4 plan-price-row">
                            <span class="plan-price fw-black">${planElegido.precio}</span>
                            <span class="${planElegido.destacado ? 'text-white text-opacity-75' : 'text-secondary'} ms-2">/mes</span>
                        </div>

                        <span class="text-uppercase small fw-bold d-block mb-3 ${planElegido.destacado ? 'text-white text-opacity-75' : 'text-secondary'}">Incluye</span>
                        <ul class="list-unstyled d-flex flex-column gap-3 mb-0">
                            ${planElegido.beneficios.map(b => `
                                <li class="plan-check ${planElegido.destacado ? 'plan-check-light' : ''} d-flex align-items-center gap-3">
                                    <span class="check-icon d-flex align-items-center justify-content-center flex-shrink-0">✓</span>
                                    <span>${b}</span>
                                </li>
                            `).join("")}
                        </ul>
                    </div>
                </div>
            </div>
        `;
    } else {
        contenedor.innerHTML = `<p class="text-secondary">Plan no encontrado.</p>`;
    }
</script>

</body>
</html>
