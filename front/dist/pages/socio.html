<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Traducción (i18n): va primero para que fechas y textos salgan en el idioma elegido -->
<script src="../js/i18n/en.js?v=3"></script>
<script src="../js/i18n.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socio - FitPower</title>
<!-- Iconito de la pestaña del navegador -->
<link rel="icon" type="image/x-icon" href="../assets/logos/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/logos/favicon-192.png">
<link rel="apple-touch-icon" href="../assets/logos/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--fondo:#0a0a0a;--caja:#141414;--caja2:#1a1a1a;--borde:#242424;--txt:#fff;--gris:#8a8a8a;--azul:#2f6bff;--azul-s:rgba(47,107,255,.14);--verde:#22c55e;--amarillo:#facc15;--rojo:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--txt);font-family:"Inter","Segoe UI",sans-serif;font-size:14px;min-height:100vh}
button,input,select{font-family:inherit}
header{display:flex;align-items:center;gap:28px;padding:14px 32px;border-bottom:1px solid var(--borde);position:sticky;top:0;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);z-index:20}
.logo{font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:3px}.logo b{color:var(--azul);font-weight:400}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{background:none;border:0;color:var(--gris);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
nav button:hover{color:#fff}nav button.on{background:var(--azul-s);color:var(--azul)}
.vivo{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--gris);letter-spacing:.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulso 1.8s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.perfil{position:relative}
.avatar{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,#bfeaff 0%,#5ec8f2 55%,#2aa3e0 100%);color:#002a5c;font-weight:800;font-size:15px;letter-spacing:.5px;text-shadow:0 1px 0 rgba(255,255,255,.55);box-shadow:0 0 0 2px var(--fondo),0 0 0 4px rgba(94,200,242,.55)}
.menu{display:none;position:absolute;right:0;top:54px;width:210px;background:var(--caja);border:1px solid var(--borde);border-radius:14px;padding:8px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.menu.abierto{display:block}
.menu p{margin:0;padding:10px 12px 12px;border-bottom:1px solid var(--borde);font-size:12px;color:var(--gris)}.menu p b{display:block;color:#fff;font-size:14px}
.menu button{width:100%;margin-top:6px;background:none;border:0;color:#fff;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.menu button:hover{background:rgba(239,68,68,.12);color:var(--rojo)}
main{max-width:1200px;margin:0 auto;padding:32px}
h2{margin:0 0 4px;font-size:22px;font-weight:800}.sub{color:var(--gris);margin:0 0 24px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--caja);border:1px solid var(--borde);border-radius:16px;padding:20px}
.kpi small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gris);font-weight:600}
.kpi strong{display:block;font-size:34px;font-weight:800;margin-top:8px}.kpi span{font-size:12px;color:var(--gris)}
.kpi.az{background:linear-gradient(135deg,#0b2a7a,var(--azul));border:0}.kpi.az small,.kpi.az span{color:rgba(255,255,255,.75)}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.btn{background:var(--azul);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.5px}
.btn:hover{filter:brightness(1.12)}.btn.sec{background:var(--caja2);border:1px solid var(--borde);color:#ddd}
.btn.x{background:none;border:1px solid var(--borde);color:var(--gris);padding:6px 10px}.btn.x:hover{border-color:var(--rojo);color:var(--rojo)}
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gris);text-align:left;padding:10px 14px;font-weight:600}
td{padding:12px 14px;border-top:1px solid var(--borde)}
tr.baja td{opacity:.45}
.tabla{overflow-x:auto;padding:6px}
.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700}
.tag i{width:8px;height:8px;border-radius:50%;background:currentColor}
.t-paga{color:var(--verde);background:rgba(34,197,94,.12)}.t-retrasada{color:var(--amarillo);background:rgba(250,204,21,.12)}
.t-nopaga{color:var(--rojo);background:rgba(239,68,68,.12)}.t-baja{color:var(--gris);background:#222}
.dias{width:64px;background:var(--caja2);border:1px solid var(--borde);color:#fff;border-radius:8px;padding:7px;text-align:center;font-weight:700}
.dias:focus,.campo input:focus,.campo select:focus{outline:0;border-color:var(--azul)}
.on-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#444;margin-right:8px}.on-dot.si{background:var(--verde)}
.dosc{display:grid;grid-template-columns:260px 1fr;gap:14px}
.lista button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:#ccc;padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:600;margin-bottom:4px}
.lista button.on{background:var(--azul-s);border-color:rgba(47,107,255,.35);color:var(--azul)}
.ej{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--borde)}.ej:first-of-type{border-top:0}
.ej .n{width:28px;height:28px;border-radius:8px;background:var(--azul-s);color:var(--azul);display:grid;place-items:center;font-weight:800;font-size:12px}.ej div{flex:1}.ej small{color:var(--gris)}
.barras{display:flex;align-items:flex-end;gap:14px;height:170px;margin-top:16px}
.barras div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--gris)}
.barras i{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--azul),#0b2a7a);min-height:4px}.barras div:last-child i{background:linear-gradient(180deg,#7fb0ff,var(--azul))}
.sem{display:flex;gap:10px;flex-wrap:wrap}.sem .tag{font-size:12px;padding:8px 14px}
.fondo-m{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:50}.fondo-m.abierto{display:grid}
.modal{width:min(400px,92vw);background:var(--caja);border:1px solid var(--borde);border-radius:18px;padding:24px}
.modal h3{margin:0 0 16px}.campo{margin-bottom:12px}
.campo label{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gris);margin-bottom:6px;font-weight:600}
.campo input,.campo select{width:100%;background:var(--caja2);border:1px solid var(--borde);color:#fff;border-radius:10px;padding:12px}
.acc{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--azul);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:13px;display:none;z-index:60}
@media(max-width:760px){header{padding:12px 16px;gap:14px}.vivo span{display:none}main{padding:20px 16px}.dosc{grid-template-columns:1fr}}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--caja2);border:1px solid var(--borde);color:#fff;border-radius:12px;padding:14px;font:inherit}
textarea:focus{outline:0;border-color:var(--azul)}
.planes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.plan.actual{border-color:var(--azul);background:linear-gradient(160deg,rgba(47,107,255,.18),var(--caja))}
.plan h3{margin:0 0 6px}.plan .pr{font-size:30px;font-weight:800;margin:10px 0}.plan p{color:var(--gris);font-size:13px;min-height:38px;margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:var(--caja);border:1px solid var(--borde);color:#ccc;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--azul-s);border-color:var(--azul);color:var(--azul)}
.fila{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--borde);flex-wrap:wrap}.fila:first-of-type{border-top:0}
.fila>div{flex:1;min-width:160px}.fila small{color:var(--gris)}
.rec{font-size:10px;font-weight:800;letter-spacing:.5px;color:#002a5c;background:linear-gradient(135deg,#bfeaff,#5ec8f2);padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.nota{font-size:12px;color:var(--gris);margin:10px 0 0}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.pagar-box{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.modal.pago{position:relative;width:min(520px,94vw);max-height:92vh;overflow-y:auto;padding:28px 26px}
.p-x{position:absolute;top:14px;right:16px;background:none;border:0;color:var(--gris);font-size:26px;line-height:1;cursor:pointer}.p-x:hover{color:#fff}
.modal.pago h3{margin:0 0 16px;font-size:19px}
.p-res{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:12px;background:var(--caja2);border:1px solid var(--borde);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.p-res small{display:block;font-size:9px;letter-spacing:1px;color:var(--gris);font-weight:600;margin-bottom:4px}.p-res strong{font-size:14px}
.p-res .tot{text-align:right}.p-monto{font-size:26px!important;font-weight:800;color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--caja2);border:1px solid var(--borde);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{background:none;border:0;color:var(--gris);padding:10px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;transition:all .2s}
.seg button.on{background:var(--azul);color:#fff}
.metodos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.met{background:var(--caja2);border:1px solid var(--borde);color:#bbb;border-radius:12px;padding:12px 4px;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:all .2s}
.met:hover{border-color:#3a3a3a}.met.on{border-color:var(--azul);background:var(--azul-s);color:#fff}
.mono{width:34px;height:24px;border-radius:7px;background:linear-gradient(135deg,#0b2a7a,var(--azul));color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.5px}
.mono.g{width:54px;height:40px;font-size:15px;border-radius:12px;margin:0 auto 14px}
.mono svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8}
.cc{border-radius:18px;padding:18px 22px;margin-bottom:16px;height:178px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
  background:radial-gradient(circle at 85% 0%,rgba(94,200,242,.55),transparent 55%),linear-gradient(135deg,#061a4d,#1d4ed8 60%,#2f6bff);box-shadow:0 14px 30px rgba(47,107,255,.25)}
.cc::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.08);right:-60px;bottom:-110px}
.cc-top{display:flex;justify-content:space-between;align-items:center}
.cc-chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f3d98b,#c9a24a)}
.cc-tipo{font-size:10px;letter-spacing:1.5px;font-weight:700;color:rgba(255,255,255,.8);text-transform:uppercase}
.cc-num{font-size:20px;letter-spacing:2.5px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.cc-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;letter-spacing:1px;font-weight:600}
.cc-bot small{display:block;font-size:8px;opacity:.65;margin-bottom:2px}
.b-visa{font-weight:800;font-style:italic;font-size:19px;letter-spacing:1px}
.b-mc{display:inline-flex}.b-mc i{width:26px;height:26px;border-radius:50%;background:#eb001b}.b-mc i+i{background:#f79e1b;margin-left:-11px;opacity:.92}
.seg2{display:flex;gap:6px;margin-bottom:14px}
.seg2 button{flex:1;background:var(--caja2);border:1px solid var(--borde);color:var(--gris);padding:9px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer}
.seg2 button.on{border-color:var(--azul);color:var(--azul);background:var(--azul-s)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn.big{width:100%;padding:15px;font-size:13px;margin-top:6px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:giro .7s linear infinite;vertical-align:-3px;margin-right:9px}
@keyframes giro{to{transform:rotate(360deg)}}
.otra{text-align:center;padding:10px 6px 18px;color:#ccc;font-size:13px;line-height:1.5}.otra p{margin:0}
.diasm{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.diasm button{background:var(--caja2);border:1px solid var(--borde);color:#ddd;padding:10px 6px;border-radius:12px;cursor:pointer;font-weight:700;font-size:12px;line-height:1.3}
.diasm button small{display:block;color:var(--gris);font-weight:500;font-size:10px;margin-top:2px;text-transform:capitalize}
.diasm button.on{border-color:var(--azul);background:var(--azul-s);color:#fff}
.ok{text-align:center;padding:6px 0 4px}.ok h3{margin:12px 0 4px!important}
.check{width:84px;height:84px}.check circle{stroke-dasharray:151;stroke-dashoffset:151;animation:trazo .6s ease forwards}
.check path{stroke-dasharray:50;stroke-dashoffset:50;animation:trazo .4s .45s ease forwards}@keyframes trazo{to{stroke-dashoffset:0}}
.ticket{background:var(--caja2);border:1px dashed #333;border-radius:14px;padding:6px 16px;margin:18px 0 16px;text-align:left}
.ticket div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--borde);font-size:13px}.ticket div:first-child{border-top:0}
.ticket span{color:var(--gris)}.ticket b{text-align:right}
@media(max-width:480px){.metodos{grid-template-columns:repeat(2,1fr)}.p-res{grid-template-columns:1fr 1fr}.p-res .tot{grid-column:1/-1;text-align:left}}
.pk-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.pk-ok{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(34,197,94,.45);background:rgba(34,197,94,.08);color:#22c55e;font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px}
.pk-ok i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pk-top{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;margin-bottom:16px}
.pk-disp{position:relative;overflow:hidden;border-radius:20px;padding:28px;min-height:214px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(94,140,255,.35);
  background:radial-gradient(circle at 90% 5%,rgba(94,200,242,.28),transparent 45%),linear-gradient(135deg,#0b2a9a,#1d4ed8 55%,#2f6bff);box-shadow:0 18px 40px rgba(29,78,216,.25)}
.pk-disp::after{content:"";position:absolute;right:-34px;top:-64px;width:170px;height:170px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.pk-lbl{font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,.85)}
.pk-big{display:flex;align-items:center;gap:14px;margin:10px 0 14px}
.pk-big b{font-size:68px;line-height:1;font-weight:800;letter-spacing:-2px}.pk-big span{font-size:14px;line-height:1.3;color:rgba(255,255,255,.85)}
.pk-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.18);max-width:384px;overflow:hidden}
.pk-bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s ease}
.pk-sub{font-size:12px;color:rgba(255,255,255,.8);margin-top:10px}
.pk-res{background:var(--caja);border:1px solid var(--borde);border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.pk-res .pk-lbl{color:var(--gris)}
.pk-cols{display:grid;grid-template-columns:1fr 1fr;margin-top:6px}
.pk-cols>div{padding-left:0}.pk-cols>div+div{border-left:1px solid var(--borde);padding-left:22px}
.pk-cols b{display:block;font-size:34px;font-weight:800;line-height:1.2}.pk-cols b.az{color:var(--azul)}
.pk-cols small{display:flex;align-items:center;gap:8px;font-size:12px;color:#bbb;margin-top:6px}
.pk-cols small i{width:11px;height:11px;border-radius:3px;border:1.5px solid #bbb}.pk-cols small i.az{border-color:var(--azul)}
.pk-act{border-top:1px solid var(--borde);padding-top:16px;font-size:12px;color:#666}
.pk-lote{background:var(--caja);border:1px solid var(--borde);border-radius:20px;padding:28px}
.pk-lh{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--borde)}
.pk-lh strong{display:block;font-size:15px}.pk-lh small{color:var(--gris);font-size:12px}
.pk-zona{font:10px ui-monospace,Menlo,monospace;letter-spacing:1.5px;color:#777;background:#1a1a1a;border:1px solid var(--borde);padding:8px 12px;border-radius:8px}
.pk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pk-lugar{position:relative;height:112px;border:1px solid #2a2a2a;border-radius:12px;background:#0c0c0c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:border-color .25s,box-shadow .25s,transform .2s,background .25s,opacity .25s}
.pk-lugar::after{content:"";position:absolute;bottom:0;left:50%;width:26px;height:2px;margin-left:-13px;background:#444;border-radius:2px;transition:background .25s}
.pk-n{position:absolute;top:9px;left:10px;font:10px ui-monospace,Menlo,monospace;color:#555}
.pk-p{font-size:26px;font-weight:800;line-height:1}
.pk-lugar svg.cr{width:24px;height:24px;stroke:var(--azul);fill:none;stroke-width:1.6}
.pk-btn{background:#1d1d1d;border:1px solid #333;color:#ccc;font-size:9px;letter-spacing:.8px;font-weight:700;text-transform:uppercase;padding:6px 12px;border-radius:7px;cursor:pointer;transition:all .2s}
.pk-btn:hover:not(:disabled){border-color:#666;color:#fff}
.pk-lugar.prem{border-color:rgba(47,107,255,.55);background:linear-gradient(180deg,rgba(47,107,255,.09),#0c0c0c)}
.pk-lugar.prem .pk-n{color:var(--azul)}.pk-lugar.prem::after{background:var(--azul)}
.pk-lugar.prem .pk-btn{border-color:rgba(47,107,255,.6);color:var(--azul);background:rgba(47,107,255,.08)}
.pk-lugar.prem .pk-btn:hover:not(:disabled){background:var(--azul);color:#fff}
.pk-lugar.mio,.pk-lugar.prem.mio{border-color:var(--rojo);background:linear-gradient(180deg,rgba(239,68,68,.12),#0c0c0c);box-shadow:0 0 0 1px rgba(239,68,68,.35),0 10px 26px rgba(239,68,68,.2);transform:translateY(-2px)}
.pk-lugar.mio .pk-n{color:var(--rojo)}.pk-lugar.mio::after{background:var(--rojo)}.pk-lugar.mio svg.cr{stroke:var(--rojo)}
.pk-lugar.mio .pk-btn,.pk-lugar.prem.mio .pk-btn{background:var(--rojo);border-color:var(--rojo);color:#fff}
.pk-lugar.mio .pk-btn:hover{filter:brightness(1.15)}
.pk-lugar.ocup,.pk-lugar.lock{opacity:.5}.pk-lugar.ocup .pk-p{color:#555}
.pk-lugar .pk-btn:disabled,.pk-lugar.prem .pk-btn:disabled{cursor:default;color:#666;border-color:#2a2a2a;background:#141414}
.pk-rest{position:absolute;top:9px;right:10px;font-size:9px;font-weight:700;color:var(--rojo)}
.pk-ent{display:flex;align-items:center;gap:14px;margin-top:24px;color:#555;font-size:10px;letter-spacing:3px}
.pk-ent::before,.pk-ent::after{content:"";flex:1;height:1px;background:#262626}
.pk-nota{font-size:12px;color:#666;margin:16px 0 0}
@media(max-width:760px){.pk-top{grid-template-columns:1fr}.pk-grid{grid-template-columns:repeat(3,1fr)}.pk-big b{font-size:54px}}

</head>
<body>
<header>
  <div class="logo">FIT<b>POWER</b></div>
  <nav id="nav"></nav>
  <div class="vivo"><i class="dot"></i><span>EN LÍNEA</span></div>
  <div class="perfil">
    <button class="avatar" id="avatar" title="Mi perfil"></button>
    <div class="menu" id="menu">
      <p><b id="miNombre"></b>Socio</p>
      <button id="salir">Cerrar sesión</button>
    </div>
  </div>
</header>
<main id="vista"></main>
<div class="fondo-m" id="fm"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="../js/api.js"></script>
<script src="../js/gifs.js"></script>
<script>
let D = null, tab = 'rutinas', rutinaSel = null, verTodos = false;

const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $$ = n => '$' + Number(n||0).toLocaleString('es');
const fecha = s => new Date(String(s).replace(' ','T')).toLocaleString('es',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ESTADO = {Pagada:['paga','Paga'],Pendiente:['retrasada','Pendiente'],Vencida:['nopaga','Vencida']};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)}

async function cargar(){
  const r = await API.socioTodo();
  if(r.code === 'no_auth'){ window.location.href = 'login.html'; return; }
  if(r.status !== 'success'){ toast(r.message || 'Error al cargar datos'); return; }
  D = r.data;
  if(!D.rutinas.some(x => x.id == rutinaSel)) rutinaSel = D.rutinas[0]?.id ?? null;
  const ini = (D.yo.nombre[0] + (D.yo.apellido||' ')[0]).toUpperCase();
  $('#avatar').textContent = ini; $('#miNombre').textContent = `${D.yo.nombre} ${D.yo.apellido}`;
  render();
}
async function accion(a, d, ok){
  const r = await API.socioAccion(a, d);
  if(r.status !== 'success'){ toast(r.message || 'No se pudo completar'); return false; }
  if(ok) toast(ok);
  await cargar(); return true;
}

const vacio = t => `<p class="sub" style="padding:16px">${t}</p>`;
const vistas = {
  rutinas(){
    const r = D.rutinas.find(x => x.id == rutinaSel);
    if(!r) return `<h2>Rutinas</h2>${vacio('Tu entrenador todavía no te asignó rutinas.')}`;
    return `<h2>Rutinas</h2><p class="sub">Rutinas que te asignó tu entrenador</p>
    <div class="dosc"><div class="card lista">${D.rutinas.map(x=>`<button class="${x.id==r.id?'on':''}" data-r="${x.id}">${esc(x.nombre)}</button>`).join('')}</div>
    <div class="card"><div class="barra"><strong style="font-size:16px">${esc(r.nombre)}</strong><span class="tag t-paga" style="color:var(--azul);background:var(--azul-s)">${esc(r.dificultad)} · ${esc(r.grupo_muscular)}</span></div>
    ${r.ej.length ? r.ej.map((x,i)=>`<div class="ej" data-gif="${esc(x.n)}" data-gif-src="${esc(x.g||'')}"><span class="n">${i+1}</span><div>${esc(x.n)}<span class="gif-ico">▶</span><br><small>${esc(x.s)}</small></div></div>`).join('') : '<p class="sub">Esta rutina todavía no tiene ejercicios.</p>'}</div></div>`;
  },
  clases(){
    return `<h2>Clases</h2><p class="sub">Anotate en las próximas clases</p>
    <div class="card">${D.clases.length ? D.clases.map(c=>{
      const llena = c.anotados >= c.cupo;
      const boton = c.inscripto ? `<button class="btn sec" data-cancel="${c.id}">Cancelar</button>`
        : `<button class="btn" data-anotar="${c.id}" ${llena?'disabled':''}>${llena?'Completa':'Anotarme'}</button>`;
      return `<div class="fila"><div><strong>${esc(c.nombre)}</strong> ${c.inscripto?'<span class="rec">ANOTADO</span>':''}<br><small>${fecha(c.dia_hora)}${c.entrenador?' · '+esc(c.entrenador):''}</small></div>
      <small>${c.anotados}/${c.cupo} lugares</small>${boton}</div>`}).join('') : vacio('No hay clases programadas por ahora.')}</div>`;
  },
  plan(){
    const actual = D.planes.find(p => p.id == D.yo.id_plan), c = D.cuota, e = c && ESTADO[c.estado], pagable = c && c.estado !== 'Pagada';
    return `<h2>Mi plan</h2><p class="sub">Tu plan actual y otros planes disponibles</p>
    <div class="grid"><div class="card kpi az"><small>Plan actual</small><strong>${actual?esc(actual.nombre):'Sin plan'}</strong><span>${actual?$$(actual.precio)+' por mes':'Elegí uno abajo'}</span></div>
    <div class="card kpi"><small>Última cuota</small><strong style="font-size:24px;margin-top:14px">${e?`<span class="tag t-${e[0]}"><i></i>${e[1]}</span>`:'—'}</strong><span>${c?$$(c.monto)+' · vence '+esc(c.fecha_vencimiento):'Sin cuotas registradas'}</span>${pagable?`<div class="pagar-box"><button class="btn" data-pagar="1">Pagar ahora</button>${c.pago_mostrador?`<span class="tag t-retrasada"><i></i>Mostrador · ${fechaCorta(c.pago_mostrador)}</span>`:''}</div>`:''}</div></div>
    <div class="planes">${D.planes.map(p=>`<div class="card plan ${p.id==D.yo.id_plan?'actual':''}"><h3>${esc(p.nombre)}</h3><div class="pr">${$$(p.precio)}<small style="font-size:12px;color:var(--gris);font-weight:400"> /mes</small></div>
      <p>${esc(p.descripcion)}</p><button class="btn ${p.id==D.yo.id_plan?'sec':''}" data-plan="${p.id}" ${p.id==D.yo.id_plan?'disabled':''}>${p.id==D.yo.id_plan?'Tu plan':'Comprar este plan'}</button></div>`).join('')}</div>
    <p class="nota">Al cambiar de plan se genera la cuota como pendiente; el pago se realiza en recepción.</p>`;
  },
  objetivo(){
    const obj = D.yo.objetivo;
    let ents = [...D.entrenadores].map(t => ({...t, coincide: !!obj && t.especialidad === obj, lleno: t.alumnos >= D.max_alumnos && t.id != D.yo.id_entrenador}));
    ents.sort((a,b) => b.coincide - a.coincide);
    const lista = verTodos || !obj ? ents : ents.filter(t => t.coincide);
    return `<h2>Mi objetivo</h2><p class="sub">Contanos qué querés lograr y elegí un entrenador especializado</p>
    <div class="chips">${D.objetivos.map(o=>`<button class="chip ${o===obj?'on':''}" data-obj="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div class="barra"><strong style="font-size:16px">Entrenadores disponibles</strong>${obj?`<button class="btn sec" id="verTodos">${verTodos?'Ver solo especializados':'Ver todos'}</button>`:''}</div>
    <div class="card">${!obj ? vacio('Elegí un objetivo para ver los entrenadores recomendados. Mientras tanto, estos son todos:') : ''}
    ${lista.length ? lista.map(t=>`<div class="fila"><div><strong>${esc(t.nombre)} ${esc(t.apellido)}</strong>${t.coincide?'<span class="rec">RECOMENDADO</span>':''}<br><small>${esc(t.especialidad||'Sin especialidad cargada')} · ${t.alumnos} alumnos</small></div>
      ${t.id==D.yo.id_entrenador?'<span class="tag t-paga"><i></i>Tu entrenador</span>':`<button class="btn" data-ent="${t.id}" ${t.lleno?'disabled':''}>${t.lleno?'Sin cupos':'Elegir'}</button>`}</div>`).join('')
      : vacio('No hay entrenadores especializados en este objetivo por ahora. Tocá "Ver todos".')}</div>`;
  },
  quejas(){
    return `<h2>Quejas</h2><p class="sub">Un espacio para desahogarte. Solo vos podés ver lo que escribas acá.</p>
    <div class="card"><textarea id="txtQueja" maxlength="2000" placeholder="Escribí lo que quieras..."></textarea>
    <div class="acc"><button class="btn" id="guardarQ">Guardar</button></div></div>
    <div class="card" style="margin-top:14px">${D.quejas.length ? D.quejas.map(q=>`<div class="fila"><div><span style="white-space:pre-wrap">${esc(q.texto)}</span><br><small>${fecha(q.fecha)}</small></div><button class="btn x" data-delq="${q.id}">Borrar</button></div>`).join('') : vacio('Todavía no escribiste nada.')}</div>`;
  }
};
const TABS = [['rutinas','Rutinas'],['clases','Clases'],['plan','Mi plan'],['objetivo','Mi objetivo'],['quejas','Quejas'],['parking','Parking']];
function render(){
  const verPk = puedeParking(); if(!verPk && tab==='parking') tab = 'rutinas';
  $('#nav').innerHTML = TABS.filter(([k])=>k!=='parking'||verPk).map(([k,n])=>`<button class="${k===tab?'on':''}" data-t="${k}">${n}</button>`).join('');
  $('#vista').innerHTML = D ? vistas[tab]() : vacio('Cargando...');
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); const d = t ? t.dataset : {};
  if(!e.target.closest('.perfil')) $('#menu').classList.remove('abierto');
  if(!t || t.disabled) return;
  if(e.target.id==='fm'){ if(pago) cerrarPago(); return; }
  if(d.pclose) return cerrarPago();
  if(d.pagar) return abrirPago();
  if(d.ptab){ pago.tab = d.ptab; return pintarPago(); }
  if(d.met){ pago.met = d.met; return pintarPago(); }
  if(d.tipo && pago){ pago.tipo = d.tipo; return pintarPago(); }
  if(d.dia){ pago.fecha = d.dia; return pintarPago(); }
  if(d.pgo) return pagoPagar();
  if(d.pmos){ if(!pago.fecha) return toast('Elegí una fecha'); const f = pago.fecha; if(await accion('pagar_mostrador', {cuota_id:pago.cuota.id, fecha:f}, 'Listo: te esperamos el '+fechaCorta(f))) cerrarPago(); return; }
  if(d.cancm){ if(await accion('cancelar_mostrador', {cuota_id:pago.cuota.id}, 'Reserva cancelada')) cerrarPago(); return; }
  if(d.t){ tab = d.t; render(); if(tab==='parking') cargarParking(); return; }
  if(d.plugar) return pkAccion('parking_reservar', {lugar:+d.plugar}, 'Lugar '+String(d.plugar).padStart(2,'0')+' reservado');
  if(d.pcancel) return pkAccion('parking_cancelar', {}, 'Reserva cancelada');
  if(d.r){ rutinaSel = +d.r; return render(); }
  if(d.anotar) return accion('anotar_clase', {clase_id:+d.anotar}, '¡Anotado!');
  if(d.cancel) return accion('cancelar_clase', {clase_id:+d.cancel}, 'Inscripción cancelada');
  if(d.plan){ const p = D.planes.find(x=>x.id==d.plan);
    if(confirm(`¿Cambiar al plan ${p.nombre} por ${$$(p.precio)}/mes? Se generará una cuota pendiente.`)) accion('comprar_plan', {plan_id:p.id}, 'Plan actualizado'); return; }
  if(d.obj) return accion('guardar_objetivo', {objetivo:d.obj});
  if(d.ent) return accion('elegir_entrenador', {entrenador_id:+d.ent}, 'Entrenador elegido');
  if(d.delq){ if(confirm('¿Borrar esta queja?')) accion('borrar_queja', {id:+d.delq}); return; }
  if(t.id==='verTodos'){ verTodos = !verTodos; return render(); }
  if(t.id==='guardarQ'){ const v = $('#txtQueja').value.trim(); if(!v) return toast('Escribí algo primero');
    accion('escribir_queja', {texto:v}, 'Guardado'); }
});
/* ============ PAGOS (modo demostración: no se cobra ni se guardan datos de tarjeta) ============ */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const sumarDias = n => { const d = new Date(); d.setDate(d.getDate()+n); return d; };
const fechaCorta = s => new Date(s+'T12:00:00').toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'});
const METODOS = {mp:'Mercado Pago', paypal:'PayPal', apple:'Apple Pay'};
const ICO_TARJETA = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/></svg>';
let pago = null;

function marca(d){
  if(/^4/.test(d)) return '<span class="b-visa">VISA</span>';
  if(/^(5[1-5]|2[2-7])/.test(d)) return '<span class="b-mc"><i></i><i></i></span>';
  if(/^3[47]/.test(d)) return '<span class="b-visa" style="font-style:normal;font-size:13px">AMEX</span>';
  return '<span style="opacity:.7">'+ICO_TARJETA.replace('<svg','<svg width="26" height="26" style="stroke:#fff;fill:none;stroke-width:1.6"')+'</span>';
}
function luhn(n){ let s=0,alt=false; for(let i=n.length-1;i>=0;i--){ let x=+n[i]; if(alt){ x*=2; if(x>9) x-=9; } s+=x; alt=!alt; } return s%10===0; }
function validarTarjeta(){
  if(pago.num.replace(/\D/g,'').length !== 16) return 'El número de tarjeta tiene que tener 16 dígitos';
  if(!pago.name.trim()) return 'Escribí algo en el titular';
  const m = pago.exp.match(/^(\d{2})\/(\d{2})$/);
  if(!m || +m[1]<1 || +m[1]>12) return 'Poné el vencimiento como MM/AA';
  if(!/^\d{3}$/.test(pago.cvv)) return 'El CVV tiene que tener 3 dígitos';
  return '';
}
function abrirPago(){
  const c = D.cuota; if(!c || c.estado==='Pagada') return;
  pago = {cuota:c, plan:(D.planes.find(p=>p.id==D.yo.id_plan)||{}).nombre||'—', tab:'online', met:'tarjeta', tipo:'Crédito',
          num:'', name:'', exp:'', cvv:'', fecha:c.pago_mostrador||'', procesando:false, hecho:null};
  $('#modal').className = 'modal pago'; $('#fm').classList.add('abierto'); pintarPago();
}
function cerrarPago(){ $('#fm').classList.remove('abierto'); $('#modal').className = 'modal'; pago = null; }

function pintarPago(){
  const p = pago, c = p.cuota, monto = $$(c.monto);
  const cab = `<button class="p-x" data-pclose="1" title="Cerrar">×</button><h3>Pagar cuota</h3>
    <div class="p-res"><div><small>PLAN</small><strong>${esc(p.plan)}</strong></div><div><small>VENCE</small><strong style="text-transform:capitalize">${fechaCorta(c.fecha_vencimiento)}</strong></div><div class="tot"><small>TOTAL</small><strong class="p-monto">${monto}</strong></div></div>`;
  let cuerpo = '';
  if(p.hecho){
    cuerpo = `<div class="ok"><svg class="check" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="none" stroke="#22c55e" stroke-width="2.5"/><path d="M15 27l8 8 14-16" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h3>¡Pago realizado!</h3><p class="sub" style="margin:0">Tu cuota quedó al día.</p>
      <div class="ticket"><div><span>Monto</span><b>${monto}</b></div><div><span>Método</span><b>${esc(p.hecho.metodo)}${p.hecho.ult4?' •••• '+p.hecho.ult4:''}</b></div><div><span>Fecha</span><b>${new Date().toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'})}</b></div></div>
      <button class="btn big" data-pclose="1">Listo</button></div>`;
    $('#modal').innerHTML = `<button class="p-x" data-pclose="1" title="Cerrar">×</button>` + cuerpo; return;
  }
  const seg = `<div class="seg"><button class="${p.tab==='online'?'on':''}" data-ptab="online">Pagar online</button><button class="${p.tab==='mostrador'?'on':''}" data-ptab="mostrador">Pagar en mostrador</button></div>`;
  if(p.tab==='online'){
    const tiles = `<div class="metodos">
      <button class="met ${p.met==='tarjeta'?'on':''}" data-met="tarjeta"><span class="mono">${ICO_TARJETA}</span>Tarjeta</button>
      <button class="met ${p.met==='mp'?'on':''}" data-met="mp"><span class="mono">MP</span>Mercado Pago</button>
      <button class="met ${p.met==='paypal'?'on':''}" data-met="paypal"><span class="mono">PP</span>PayPal</button>
      <button class="met ${p.met==='apple'?'on':''}" data-met="apple"><span class="mono">Pay</span>Apple Pay</button></div>`;
    const btn = txt => `<button class="btn big" data-pgo="1" ${p.procesando?'disabled':''}>${p.procesando?'<i class="spin"></i>Procesando...':txt}</button>`;
    const d = p.num.replace(/\D/g,'');
    if(p.met==='tarjeta') cuerpo = tiles + `
      <div class="seg2"><button class="${p.tipo==='Crédito'?'on':''}" data-tipo="Crédito">Crédito</button><button class="${p.tipo==='Débito'?'on':''}" data-tipo="Débito">Débito</button></div>
      <div class="cc"><div class="cc-top"><span class="cc-chip"></span><span id="ccB">${marca(d)}</span></div>
        <div class="cc-num" id="ccN">${(d+'•'.repeat(16)).slice(0,16).replace(/(.{4})/g,'$1 ').trim()}</div>
        <div class="cc-bot"><div><small>TITULAR</small><span id="ccNom">${esc((p.name||'NOMBRE APELLIDO').toUpperCase())}</span></div><div><small>${p.tipo.toUpperCase()}</small><span id="ccE">${esc(p.exp||'MM/AA')}</span></div></div></div>
      <div class="campo"><label>Número de tarjeta</label><input id="ccNum" inputmode="numeric" autocomplete="off" placeholder="1234 5678 9012 3456" value="${esc(p.num)}"></div>
      <div class="campo"><label>Titular</label><input id="ccName" autocomplete="off" placeholder="Como figura en la tarjeta" value="${esc(p.name)}"></div>
      <div class="dos"><div class="campo"><label>Vencimiento</label><input id="ccExp" inputmode="numeric" autocomplete="off" placeholder="MM/AA" value="${esc(p.exp)}"></div>
      <div class="campo"><label>CVV</label><input id="ccCvv" type="password" inputmode="numeric" autocomplete="off" placeholder="•••" value="${esc(p.cvv)}"></div></div>` + btn('Pagar '+monto) + `<p class="nota" style="text-align:center">Modo demostración: no se realiza ningún cobro ni se guardan los datos de la tarjeta. Podés usar cualquier dato de prueba.</p>`;
    else cuerpo = tiles + `<div class="otra"><span class="mono g">${esc({mp:'MP',paypal:'PP',apple:'Pay'}[p.met])}</span><p>Vas a completar el pago con <b>${METODOS[p.met]}</b>.<br><span style="color:var(--gris);font-size:12px">En esta demostración la confirmación se simula.</span></p></div>` + btn('Continuar con '+METODOS[p.met]);
  } else {
    const chips = [0,1,2,3,5,7,10].map(n => { const f = ymd(sumarDias(n)); return `<button class="${p.fecha===f?'on':''}" data-dia="${f}">${n===0?'Hoy':n===1?'Mañana':'En '+n+' días'}<small>${fechaCorta(f)}</small></button>`; }).join('');
    cuerpo = `<div class="otra"><p><b>Pagá en recepción</b> en efectivo o con tarjeta.<br>Elegí el día en que vas a ir: hasta <b>10 días</b> desde hoy.</p></div>
      <div class="diasm">${chips}</div>
      <div class="campo"><label>O elegí otra fecha</label><input type="date" id="fechaM" min="${ymd(sumarDias(0))}" max="${ymd(sumarDias(10))}" value="${esc(p.fecha)}"></div>
      <p class="nota" id="resM" style="margin:0 0 6px">${p.fecha?'Vas a pagar el <b style="color:#fff;text-transform:capitalize">'+fechaCorta(p.fecha)+'</b> en recepción.':'Todavía no elegiste una fecha.'}</p>
      <button class="btn big" data-pmos="1">${c.pago_mostrador?'Cambiar fecha':'Confirmar fecha'}</button>
      ${c.pago_mostrador?'<button class="btn sec big" data-cancm="1">Cancelar reserva en mostrador</button>':''}`;
  }
  $('#modal').innerHTML = cab + seg + cuerpo;
}
function ccActualizar(){
  const d = pago.num.replace(/\D/g,'');
  $('#ccN').textContent = (d+'•'.repeat(16)).slice(0,16).replace(/(.{4})/g,'$1 ').trim();
  $('#ccNom').textContent = (pago.name||'NOMBRE APELLIDO').toUpperCase();
  $('#ccE').textContent = pago.exp || 'MM/AA';
  $('#ccB').innerHTML = marca(d);
}
async function pagoPagar(){
  if(pago.procesando) return;
  let metodo, ult4 = '';
  if(pago.met==='tarjeta'){
    const err = validarTarjeta(); if(err) return toast(err);
    metodo = 'Tarjeta de ' + (pago.tipo==='Crédito' ? 'crédito' : 'débito');
    ult4 = pago.num.replace(/\D/g,'').slice(-4);
  } else metodo = METODOS[pago.met];
  pago.procesando = true; pintarPago();
  await new Promise(r => setTimeout(r, 1500));
  // Al servidor solo viaja el nombre del método: los datos de la tarjeta nunca salen del navegador
  const r = await API.socioAccion('pagar_cuota', {cuota_id: pago.cuota.id, metodo});
  if(!pago) return;
  pago.procesando = false;
  if(r.status !== 'success'){ toast(r.message || 'No se pudo procesar el pago'); return pintarPago(); }
  pago.hecho = {metodo, ult4}; pintarPago(); cargar();
}
function pagoFecha(f){
  const min = ymd(sumarDias(0)), max = ymd(sumarDias(10));
  if(f && (f < min || f > max)){ toast('Elegí una fecha dentro de los próximos 10 días'); f = ''; }
  pago.fecha = f; pintarPago();
}
document.addEventListener('input', e => {
  if(!pago) return; const id = e.target.id;
  if(id==='ccNum'){ pago.num = e.target.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim(); e.target.value = pago.num; }
  else if(id==='ccName'){ pago.name = e.target.value.slice(0,26); }
  else if(id==='ccExp'){ let d = e.target.value.replace(/\D/g,'').slice(0,4); if(d.length>2) d = d.slice(0,2)+'/'+d.slice(2); pago.exp = d; e.target.value = d; }
  else if(id==='ccCvv'){ pago.cvv = e.target.value.replace(/\D/g,'').slice(0,3); e.target.value = pago.cvv; return; }
  else if(id==='fechaM'){ if(e.target.value.length===10) pagoFecha(e.target.value); return; }
  else return;
  ccActualizar();
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && pago) cerrarPago(); });

/* ============ ESTACIONAMIENTO (solo planes Elite y Power) ============ */
let P = null, PK_T = 0;
const puedeParking = () => !!D && ['Elite','Power'].includes((D.planes.find(p => p.id == D.yo.id_plan) || {}).nombre);
const CORONA = '<svg class="cr" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>';
const restante = m => m >= 60 ? `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m` : `${Math.max(m,1)} min`;
async function cargarParking(){
  const r = await API.socioParking();
  if(r.code === 'no_auth'){ window.location.href = 'login.html'; return; }
  if(r.status !== 'success'){ if(tab==='parking') toast(r.message || 'No se pudo cargar el estacionamiento'); return; }
  P = r.data; PK_T = Date.now(); if(tab==='parking') render();
}
async function pkAccion(a, d, ok){
  const r = await API.socioAccion(a, d);
  toast(r.status === 'success' ? ok : (r.message || 'No se pudo completar'));
  await cargarParking();
}
vistas.parking = function(){
  if(!P) return `<h2>Estacionamiento</h2>${vacio('Cargando estacionamiento...')}`;
  const ocup = P.total - P.libres, nivel = ocup/P.total < .4 ? 'baja' : ocup/P.total < .75 ? 'media' : 'alta';
  const min = Math.floor((Date.now()-PK_T)/60000), act = min < 1 ? 'menos de un minuto' : `${min} min`;
  const celdas = P.lugares.map(l => {
    const prem = l.tipo === 'premium', bloq = prem && !P.puede_premium;
    const cls = 'pk-lugar' + (prem?' prem':'') + (l.estado==='mio'?' mio':'') + (l.estado==='ocupado'?' ocup':'') + (bloq && l.estado==='libre'?' lock':'');
    const btn = l.estado==='mio' ? `<button class="pk-btn" data-pcancel="1">Cancelar</button>`
      : l.estado==='ocupado' ? `<button class="pk-btn" disabled>Ocupado</button>`
      : bloq ? `<button class="pk-btn" disabled>Solo Power</button>`
      : `<button class="pk-btn" data-plugar="${l.n}">Reservar</button>`;
    return `<div class="${cls}"><span class="pk-n">${String(l.n).padStart(2,'0')}</span>${l.estado==='mio'?`<span class="pk-rest">${restante(l.rest)}</span>`:''}${prem?CORONA:'<span class="pk-p">P</span>'}${btn}</div>`;
  }).join('');
  return `<div class="pk-cab"><div><h2>Estacionamiento</h2><p class="sub" style="margin:0">Consultá los lugares disponibles antes de llegar</p></div><span class="pk-ok"><i></i>Acceso habilitado</span></div>
  <div class="pk-top">
    <div class="pk-disp"><div><div class="pk-lbl">Disponibilidad actual</div>
      <div class="pk-big"><b>${P.libres}</b><span>lugares<br>libres</span></div>
      <div class="pk-bar"><i style="width:${Math.round(P.libres/P.total*100)}%"></i></div></div>
      <div class="pk-sub">Ocupación ${nivel} · Nivel 01</div></div>
    <div class="pk-res"><div><div class="pk-lbl">Resumen de lugares</div>
      <div class="pk-cols"><div><b>${String(P.libres_pro).padStart(2,'0')}</b><small><i></i>Elite libres</small></div><div><b class="az">${String(P.libres_premium).padStart(2,'0')}</b><small><i class="az"></i>Power libres</small></div></div></div>
      <div class="pk-act">Actualizado hace ${act}</div></div>
  </div>
  <div class="pk-lote"><div class="pk-lh"><div><strong>Nivel 01</strong><small>Seleccioná tu lugar al ingresar</small></div><span class="pk-zona">ZONA A</span></div>
    <div class="pk-grid">${celdas}</div><div class="pk-ent">ENTRADA</div></div>
  <p class="pk-nota">Los lugares 21 a 25 son exclusivos del plan Power. La reserva vence sola a las 4 horas.</p>`;
};

$('#avatar').onclick = () => $('#menu').classList.toggle('abierto');
$('#salir').onclick = async () => { try{ await API.logout(); }catch(_){} localStorage.clear(); sessionStorage.clear(); window.location.href = 'login.html'; };

setInterval(() => { if(document.activeElement.id !== 'txtQueja' && tab !== 'quejas') cargar(); }, 15000);
setInterval(() => API.ping(), 60000);
setInterval(() => { if(tab==='parking') cargarParking(); }, 8000);
render(); cargar();
</script>
